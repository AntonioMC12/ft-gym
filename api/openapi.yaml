  /api/centers/me:
    get:
      tags: [centers]
      operationId: getCentersMe
      summary: Own affiliations and explicit platform capabilities
      description: |
        Resolves current roles and memberships from SQL using the authenticated account.
        Never trusts a center or role from personal synced state. Platform capabilities
        require an explicit CENTERS_SUPERADMIN_UIDS allowlist, independently of user.admin.
      responses:
        '200':
          description: Own centers and current capabilities; no economic or contact details.
          content:
            application/json:
              schema:
                type: object
                required: [platformCapabilities, centers]
                properties:
                  platformCapabilities: { type: array, items: { type: string } }
                  centers:
                    type: array
                    items:
                      type: object
                      required: [id, name, state, capabilities]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        state: { type: string, enum: [draft, active, inactive] }
                        capabilities: { type: array, items: { type: string } }
        '401': { description: No current session. }
        '404': { description: Module switched off. }
        '503': { description: Centers unavailable; code centers-unavailable. }
  /api/centers/member:
    get:
      tags: [centers]
      operationId: getCenterMember
      summary: Role-filtered member profile within one center
      description: |
        Manager or explicit superadmin receives contact fields; trainer receives only id, centerId,
        number, name, state and version. A member id from another center returns a generic
        404. No IBAN, payments or arbitrary source fields are included in either projection.
        Managers and superadmins additionally receive today in the center zone and up to
        100 lifecycle changes; trainers receive neither reasons nor history. State and
        endsOn use the effective temporal projection, not a background-job cache.
      parameters:
        - name: centerId
          in: query
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
        - name: id
          in: query
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
      responses:
        '200':
          description: An allowlisted member projection for the caller's role.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { type: object, description: Operational fields, plus contact fields only for managers. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability in an accessible center; code forbidden. }
        '404': { description: Module off or resource not accessible; never reveals an external center. }
        '409': { description: Center inactive; code center-inactive. }
        '503': { description: Centers unavailable; code centers-unavailable. }
  /api/platform/centers/reconciliation:
    get:
      tags: [centers]
      operationId: getCentersReconciliation
      summary: Identify logical SQL references whose JSON accounts are absent
      description: |
        Read-only reconciliation for the explicit platform allowlist. Does not grant roles,
        recreate identities or delete data automatically. A missing account cannot establish
        an authenticated session even if restored SQL still contains its previous assignment.
      responses:
        '200':
          description: Reference count and orphaned account ids, without profile or financial data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  referencedAccounts: { type: integer }
                  orphanedAccounts: { type: array, items: { type: string } }
        '401': { description: No current session. }
        '403': { description: Not in the explicit platform allowlist. }
        '404': { description: Module off. }
        '503': { description: Centers unavailable; code centers-unavailable. }
  /api/centers/status:
    get:
      tags: [centers]
      operationId: getCentersStatus
      summary: Centers storage availability
      description: |
        Requires a valid cookie or paired-mobile Bearer session. With `CENTERS_ENABLED`
        off (default), answers 404 without opening a SQL connection. When enabled,
        checks that SQL uses a limited application role and the supported schema version.
        Database absence, unsafe credentials or unapplied migrations return a bounded,
        generic 503; personal training routes continue to work independently.
        This endpoint exposes availability only; no business records or credentials.
      responses:
        '200':
          description: The centers database is available and migrated.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, stage, available, schemaVersion]
                properties:
                  enabled: { type: boolean, const: true }
                  stage: { type: string, const: centers }
                  available: { type: boolean, const: true }
                  schemaVersion: { type: string, const: '006' }
        '401':
          description: No valid session, or the session was revoked during the check.
        '404':
          description: The module is switched off.
        '503':
          description: Centers storage is unavailable; no connection details are exposed.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string, const: centers are temporarily unavailable }
                  code: { type: string, const: centers-unavailable }
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Health check
      description: |
        Always public. Also reports how many user accounts exist.

        The check writes: it creates and removes one empty file under `DATA_DIR`,
        because a server whose data directory is full or read-only has every write
        path broken while the port still answers. It is a 503 when that fails — the
        container healthcheck (`wget --spider`) reads the status and nothing else.

        The probe runs at most once every five seconds and the answer in between is
        the last one, so a poll can be that stale. The route is unauthenticated, and
        one disk write per request is not something to leave open to anyone.
      security: []
      responses:
        '200':
          description: The server is up and its data directory is writable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  users:
                    type: integer
                    description: Number of registered user accounts.
                  writable: { type: boolean, const: true }
              example: { ok: true, users: 7, writable: true }
        '503':
          description: >-
            The data directory could not be written — a full disk, or a mount that
            came back read-only. Nothing that stores anything will work until it is
            fixed; the reason is in the container log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  writable: { type: boolean, const: false }
              example: { ok: false, writable: false }

  /api/config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: Instance configuration
      description: |
        The flags the login screen needs before anyone is signed in. Both reflect
        environment variables on the server (`INVITE_ONLY`, `ALLOW_GUEST`), and so does
        `password_login`, which is there only when `PASSWORD_LOGIN=1`, and `default_lang`,
        which is there only when `DEFAULT_LANG` is set.

        `centers` is present only with `CENTERS_ENABLED=1`, for everybody. It advertises
        the implemented centers stage, not SQL credentials, business permissions or health.

        `media` is there unless the instance runs with `MEDIA_UPLOADS=0`, for everybody: the
        caps are not a secret, and its absence is how the app knows this server does not
        store photos and videos at all.

        A caller with a valid session also gets a `coach` key: the block when the
        instance has the AI Coach switched on **and** a provider connected, and `null`
        when it has not. A caller with no session gets no key at all. The block names
        the provider this instance talks to, which is the same fact
        `GET /api/coach/disclosure` will not hand out unauthenticated.

        The key is always present for a session, `null` included, so a client that
        caches this answer can tell "no Coach on this instance" from "you were not
        signed in when you asked" and knows whether asking again would change it.
      security: []
      responses:
        '200':
          description: Instance flags, plus the Coach block for a signed-in caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_only:
                    type: boolean
                    description: When true, registration requires a valid invite code.
                  centers:
                    type: object
                    description: Present only when the centers module is enabled. Does not query SQL.
                    required: [enabled, stage]
                    properties:
                      enabled: { type: boolean, const: true }
                      stage: { type: string, const: centers }
                  allow_guest:
                    type: boolean
                    description: >-
                      When false, the client hides "continue without account".
                      Guest mode is purely client-side and never calls this API.
                  coach:
                    description: >-
                      Present for a signed-in caller and absent otherwise; `null` when this
                      instance has no Coach enabled and connected. Every Coach entry point
                      in the client hangs off the block being there.
                    type: ['object', 'null']
                    properties:
                      enabled: { type: boolean, const: true }
                      provider:
                        type: string
                        description: Provider id, e.g. `anthropic`, `compatible`, `fixture`.
                      providerLabel: { type: string, description: Human-readable provider name. }
                      authMode:
                        type: string
                        enum: [instance, profile]
                        description: Whose credential the jobs spend.
                      community:
                        type: boolean
                        description: Whether "compare with others" is offered on this instance.
                  password_login:
                    type: boolean
                    const: true
                    description: >-
                      Present (and true) only when the instance runs with
                      PASSWORD_LOGIN=1; the client then offers name-and-password
                      sign-in next to passkeys.
                  default_lang:
                    type: string
                    example: pt-BR
                    description: >-
                      Present only when the instance runs with DEFAULT_LANG set: the
                      language tag the sign-in screen, and every profile that has never
                      picked a language in Settings, starts in. A profile's own choice
                      always wins; a tag the app has no translation for is ignored.
                  media:
                    $ref: '#/components/schemas/MediaConfig'
              examples:
                anonymous: { value: { invite_only: true, allow_guest: false } }
                signedInNoCoach: { value: { invite_only: true, allow_guest: false, coach: null } }
                signedIn:
                  value:
                    invite_only: true
                    allow_guest: false
                    coach: { enabled: true, provider: compatible, providerLabel: "OpenAI-compatible endpoint", authMode: instance, community: false }
                passwordLogin: { value: { invite_only: true, allow_guest: false, password_login: true } }
                media: { value: { invite_only: false, allow_guest: true, media: { imageMB: 2, gifMB: 8, videoMB: 40, videoSec: 60, quotaMB: 200, workouts: true } } }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who am I?
      description: |
        Resolves the current session to a user. A paired phone (bearer token) whose token is
        past half of `SESSION_DAYS` also receives a fresh `token` to use from now on; it carries
        the account's current session version, so "sign out everywhere" revokes it like the old
        one. Cookie sessions never get one.
      responses:
        '200':
          description: A valid session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
                  token: { type: string, description: 'Bearer sessions past half their lifetime only: the renewed token.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/register/options:
    post:
      tags: [auth]
      operationId: registerOptions
      summary: 'Start passkey registration (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialCreationOptions` (from
        `@simplewebauthn/server`'s `generateRegistrationOptions`) plus a challenge id
        `cid`. The client passes `options` to
        `navigator.credentials.create()` (or `@simplewebauthn/browser`'s
        `startRegistration`) and sends the result to `/api/register/verify` together
        with the `cid`. Challenges are one-shot and expire after 5 minutes.

        CSRF-exempt (the challenge is the credential). No session required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 40
                  description: Display name for the new profile (trimmed, max 40 chars).
                code:
                  type: string
                  description: >-
                    Invite code, required (and validated) only when the instance
                    runs with INVITE_ONLY. Compared case-insensitively.
            example: { name: "Ada", code: "3F9C21A07B54D688" }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid:
                    type: string
                    description: One-shot challenge id, echo it back to /api/register/verify.
                  options:
                    $ref: '#/components/schemas/WebAuthnRegistrationOptions'
        '400':
          description: '`name` missing/empty.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "name required" }
        '403':
          description: Instance is invite-only and the code is missing, used, or revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required", code: "invite" }

  /api/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: 'Finish passkey registration (WebAuthn ceremony, step 2)'
      description: |
        Verifies the authenticator's attestation response against the stored
        challenge (`verifyRegistrationResponse`), creates the user + credential, and
        signs the caller in (sets the session cookie). On an invite-only instance the
        invite is re-checked and burned here. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/register/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnRegistrationCredential'
      responses:
        '200':
          description: Registered and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                Session cookie (`__Host-gymsid` on HTTPS deployments, `gymsid` over
                plain http). HttpOnly, SameSite=Lax, Max-Age = SESSION_DAYS.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            Challenge expired/replayed, or the attestation did not verify (wrong
            origin/RP ID, malformed response…). The message is human-readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "challenge expired, try again", code: "challenge-expired" }
        '403':
          description: Invite-only and the code became invalid since step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invite code is no longer valid, ask for a new one", code: "invite" }
        '409':
          description: This credential id is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered" }

  /api/login/options:
    post:
      tags: [auth]
      operationId: loginOptions
      summary: 'Start passkey login (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialRequestOptions`
        (`generateAuthenticationOptions` with an empty `allowCredentials`; discoverable
        credentials / resident keys are required at registration, so the browser offers
        the user their passkeys itself) plus a one-shot challenge id `cid`.
        CSRF-exempt. Takes no request body.
      security: []
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  options:
                    $ref: '#/components/schemas/WebAuthnAuthenticationOptions'

  /api/login/verify:
    post:
      tags: [auth]
      operationId: loginVerify
      summary: 'Finish passkey login (WebAuthn ceremony, step 2)'
      description: |
        Verifies the assertion (`verifyAuthenticationResponse`), updates the signature
        counter, and signs the caller in (sets the session cookie). CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/login/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnAuthenticationCredential'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Challenge expired/replayed, or the assertion did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "not verified" }
        '403':
          description: The account has been disabled by an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '404':
          description: The passkey's credential id is unknown to this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown passkey, create a profile first", code: "unknown-credential" }
        '500':
          description: Credential exists but its user record is missing (corrupt db).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "user missing" }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (this device)
      description: >-
        Clears the session cookie. Always succeeds: an invalid or missing session is
        a no-op. The token itself stays cryptographically valid until it expires; use
        /api/logout/all to revoke tokens.
      security: []
      responses:
        '200':
          description: Cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/logout/all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sign out everywhere
      description: |
        Bumps the account's session version, which invalidates **every** cookie and
        Bearer token ever issued for it, on every device, including a copy someone
        walked off with. Passkeys are untouched; signing back in works immediately.
        Also clears the caller's own cookie. Unredeemed pairing codes for the account
        are voided too.
      responses:
        '200':
          description: All sessions revoked.
          headers:
            Set-Cookie:
              description: Expires the caller's session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pair/create:
    post:
      tags: [pairing]
      operationId: pairCreate
      summary: Mint a pairing code for the mobile app
      description: |
        Called from an already signed-in browser tab (Settings → "Pair the mobile
        app"). Returns an 8-character code (alphabet without 0/O/1/I) the phone
        redeems within 5 minutes via /api/pair/redeem. One-shot. One live code per
        profile: minting a new one retires the previous one.
      responses:
        '200':
          description: A fresh pairing code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 8 chars from ABCDEFGHJKLMNPQRSTUVWXYZ23456789.
              example: { code: "K7WQ2MZP" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pair/redeem:
    post:
      tags: [pairing]
      operationId: pairRedeem
      summary: Redeem a pairing code for a Bearer token
      description: |
        Called from the mobile app with the code shown in the browser. No session
        required: the code *is* the credential (one-shot, 5-minute TTL). Returns the
        same HMAC-signed session token the cookie would carry; the app sends it as
        `Authorization: Bearer <token>` from then on. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The pairing code (case-insensitive).
            example: { code: "K7WQ2MZP" }
      responses:
        '200':
          description: Paired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed session token, valid for SESSION_DAYS.
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            Code unknown, already used, expired, or the account behind it is gone or
            disabled (deliberately the same message for all of these).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid or expired code", code: "pair-invalid" }

  /api/login/password:
    post:
      tags: [password]
      operationId: loginPassword
      summary: Sign in with a profile name or e-mail and a password
      description: |
        Only a profile that has set a password can sign in this way. The identifier is the
        profile's display name or the e-mail address it added (`POST /api/account/email`),
        compared trimmed, NFKC-normalised and case-insensitively. Send it as `identifier`
        (what the app sends), `name` (the original field, still accepted) or `email`. In
        `identifier` and `name`, a value with an `@` is looked up as an e-mail first and
        then as a name; `email` is looked up only as an e-mail.
        A wrong password, an unknown name and a name whose profile has no password all get
        the same `401` after the same scrypt work, so neither the answer nor its timing says
        which names exist. So does a password that was right when its check started but
        was changed, reset or removed before the check finished. Five wrong passwords for an
        account are free and the sixth pauses it, whichever identifier they named it by (see *Throttling*); passkey
        sign-in is never paused by this. Sets the
        same session cookie as `/api/login/verify`. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: One of `identifier`, `name` or `email`, and the password.
              properties:
                identifier: { type: string, description: A profile name or an e-mail address. }
                name: { type: string, description: 'The original field: a profile name, or an e-mail address.' }
                email: { type: string, description: An e-mail address only. }
                password: { type: string, maxLength: 256 }
            examples:
              byName: { value: { identifier: "Ada", password: "correct horse battery staple" } }
              byEmail: { value: { identifier: "ada@example.com", password: "correct horse battery staple" } }
              legacy: { value: { name: "Ada", password: "correct horse battery staple" } }
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Name or password missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "name and password required", code: "missing" }
        '401':
          description: Wrong name or password. Deliberately one answer for every cause.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "wrong name or password", code: "bad-credentials" }
        '403':
          description: The right password for a disabled account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/register/password:
    post:
      tags: [password]
      operationId: registerPassword
      summary: Create a profile with a name and password
      description: |
        For browsers that cannot make a passkey (plain http on a LAN address, some Firefox
        setups). Creates the profile and signs it in. The same invite rules as passkey
        registration apply: on an invite-only instance the code is checked first, checked
        again after hashing, and burned. The password must be 10–256 characters and not one
        of the passwords guessing scripts try first; no two profiles with a password may
        share a name. An optional `email` is stored as the profile's sign-in e-mail (see
        `POST /api/account/email`); one that is not an address is refused with `400
        email-invalid`, one that is in use with `409 email-taken`. Both are asked only after the
        hash and the second invite check, so without a valid code it is never answered,
        which counts against the caller's address like a wrong invite code. **Not**
        CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, maxLength: 40 }
                password: { type: string, minLength: 10, maxLength: 256 }
                code: { type: string, description: Invite code (INVITE_ONLY only). }
                email: { type: string, maxLength: 254, description: Optional sign-in e-mail. }
            example: { name: "Ada", password: "correct horse battery staple", code: "3F9C21A07B54D688" }
      responses:
        '200':
          description: Registered and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            The password breaks the policy with `too-short` (under 10 characters), `too-long`
            (over 256) or `too-common`; a field is `missing`; or `email-invalid`: the
            `email` given is not an e-mail address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                policy: { value: { error: "this password is too easy to guess", code: "too-common" } }
                email: { value: { error: "that is not an e-mail address", code: "email-invalid" } }
        '403':
          description: Invite-only and the code is missing, used or revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required", code: "invite" }
        '409':
          description: >-
            `name-taken` (see NameTaken) or `email-taken`: the e-mail is in use by another
            profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already uses this e-mail address", code: "email-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/login/password-reset:
    post:
      tags: [password]
      operationId: redeemPasswordReset
      summary: Set a new password with an admin's one-time reset code
      description: |
        Redeems the code from `POST /api/admin/user/password-reset` (valid 24 h, single
        use, stored only as a hash; dashes, spaces and case do not matter) and signs in.
        A new password that breaks the policy is refused without using up the code. Every
        other session of the account ends. Wrong codes count against the caller's address
        only (see *Throttling*), never against the name, so they cannot keep a real code
        from working. The profile is named by its name or its sign-in e-mail, in
        `identifier`, `name` or `email` as at sign-in. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, next]
              properties:
                identifier: { type: string, description: The profile name or its sign-in e-mail. }
                name: { type: string, description: The original field; an e-mail works here too. }
                email: { type: string }
                code: { type: string, example: "K7WQ-2MZP-4HXA" }
                next: { type: string, minLength: 10, maxLength: 256 }
      responses:
        '200':
          description: Password set and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            `reset-invalid` (wrong, used or expired code; one answer for all),
            `missing`, or a password-policy code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that reset code is wrong or has expired", code: "reset-invalid" }
        '403':
          description: The account has been disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '409': { $ref: '#/components/responses/NameTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/password:
    get:
      tags: [password]
      operationId: getAccountPassword
      summary: Whether this profile has a password
      responses:
        '200':
          description: The profile's password state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: boolean }
                  setAt: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
                  passkeys: { type: integer, description: 'How many passkeys the profile has; 0 means the password cannot be removed.' }
                  name: { type: string, description: The name to sign in with. }
                  nameTaken:
                    type: boolean
                    description: Another profile already signs in with this name, so no password can be set here.
                  email:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: The e-mail this profile may sign in with (POST /api/account/email), or null.
              example: { set: true, setAt: "2026-09-23T10:00:00.000Z", passkeys: 1, name: "Ada", nameTaken: false, email: "ada@example.com" }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [password]
      operationId: setAccountPassword
      summary: Set or change this profile's password
      description: |
        Proof first: `current` when the profile has a password, or a passkey assertion made
        for this request (`cid` from `POST /api/login/options`, `credential` signed by one of
        *this* profile's passkeys). The passkey is the only way to set a first password, and the way to
        replace a forgotten one. A session alone is never enough. Wrong `current` values
        count toward the same pause as wrong sign-ins. On success the session version is
        bumped, which ends every other session and pending pairing code of the account; the
        caller's own continues on a fresh cookie, or a fresh `token` for a Bearer caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                next: { type: string, minLength: 10, maxLength: 256 }
                current: { type: string }
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnAuthenticationCredential' }
      responses:
        '200':
          description: Saved. Other sessions have ended.
          headers:
            Set-Cookie:
              description: A fresh session cookie for this browser (cookie callers).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  token: { type: string, description: 'Bearer callers only: the token to use from now on.' }
        '400': { $ref: '#/components/responses/PasswordPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            No acceptable proof: `current-required`, `current-wrong`, `passkey-required`
            (no password yet, so a passkey has to confirm), or `passkey` (the assertion did
            not verify or belongs to another profile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "your current password is not right", code: "current-wrong" }
        '409': { $ref: '#/components/responses/NameTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }
    delete:
      tags: [password]
      operationId: removeAccountPassword
      summary: Remove this profile's password
      description: >-
        Refused while the profile has no passkey: the password would be its last way in.
        Otherwise the body carries the same proof setting one takes: `current`, the
        password itself, or a passkey assertion made for this request (`cid` from
        `POST /api/login/options`, `credential` signed by one of *this* profile's
        passkeys). A session alone is never enough: a stolen cookie must not take away
        the owner's way in where passkeys do not work. The last-way-in refusal comes before
        the proof is checked, and is checked again after it. Wrong `current` values count
        toward the same pause as wrong sign-ins. Existing sessions are left alone
        (`POST /api/logout/all` ends them). A profile without a password gets 200 as well,
        with no proof asked. Audited as `auth.password.remove`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed (or there was none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: The password is the profile's only way in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the password is the only way into this profile", code: "last-way-in" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/email:
    post:
      tags: [password]
      operationId: setAccountEmail
      summary: Set, change or remove the e-mail this profile may sign in with
      description: |
        An e-mail address to type at `POST /api/login/password` instead of the profile
        name. No mail is ever sent to it (there is no verification and no reset mail;
        resets stay the admin's one-time code), so it is only an identifier. Stored
        trimmed, NFKC-normalised and lower-cased; at most 254 characters; unique across
        every profile, and never another password-holding profile's name. An empty or null
        `email` removes it (as `DELETE` does).

        The body carries the same proof as setting a password (see OwnerProof): a session
        alone is never enough. Saving the address the profile already has answers 200 with
        no proof asked. An address in use by another profile is refused only after the
        proof, with `409 email-taken`, and counts against the caller's address and account
        (20 free, then 30 s doubling to 15 min), so the answer never costs less than a
        passkey prompt or a password check, and runs out after a few tries. It says an
        address is in use somewhere on this instance, never by whom. Audited as
        `auth.email.set` / `auth.email.change` with the address masked (`a…@e…`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OwnerProof'
                - type: object
                  properties:
                    email:
                      oneOf: [{ type: string, maxLength: 254 }, { type: 'null' }]
            example: { email: "ada@example.com", current: "correct horse battery staple" }
      responses:
        '200':
          description: Saved (or removed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  email: { oneOf: [{ type: string }, { type: 'null' }], description: The address as stored. }
              example: { ok: true, email: "ada@example.com" }
        '400':
          description: Not an e-mail address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that is not an e-mail address", code: "email-invalid" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: Another profile already uses this address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already uses this e-mail address", code: "email-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }
    delete:
      tags: [password]
      operationId: removeAccountEmail
      summary: Remove the e-mail this profile may sign in with
      description: >-
        The profile then signs in by its name only. Takes the same proof as setting one
        (OwnerProof); a profile without an e-mail gets 200 with none asked. Audited as
        `auth.email.remove`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed (or there was none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  email: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/admin/user/password-reset:
    post:
      tags: [admin, password]
      operationId: adminPasswordReset
      summary: 'Admin: issue a one-time password reset code'
      description: |
        Returns a code (12 characters from the pairing alphabet, 60 bits) that is shown
        once, stored only as a SHA-256, valid for 24 h and good for one
        `POST /api/login/password-reset`. Issuing it removes the profile's current password
        and bumps its session version (every session and pending pairing code ends);
        passkeys keep working. A newer code replaces an older one. Admin accounts are
        refused; an admin sets their own password in Settings. Audited as
        `admin.password.reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The user id. }
      responses:
        '200':
          description: The code, once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  name: { type: string, description: The name to redeem it with. }
                  code: { type: string }
                  expires: { type: number, description: Expiry (ms). }
              example: { ok: true, name: "Ada", code: "K7WQ-2MZP-4HXA", expires: 1790000000000 }
        '400':
          description: The target is an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "an admin sets their own password in Settings" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }
        '409': { $ref: '#/components/responses/NameTaken' }

  /api/account/passkeys:
    get:
      tags: [passkeys]
      operationId: listPasskeys
      summary: This profile's passkeys
      description: >-
        Every passkey that signs this profile in, without key material. `created` and
        `lastUsed` are null for a passkey made before they were recorded.
      responses:
        '200':
          description: The list, and what it allows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [passkeys]
      operationId: removePasskey
      summary: Remove one passkey
      description: |
        Refused while it is the profile's last way in: its only passkey, and no password
        that can sign in (a password counts only while `PASSWORD_LOGIN` is on). Otherwise
        the body carries the same proof adding one takes (`OwnerProof`): a session alone is
        never enough, since a stolen cookie could otherwise choose which of the owner's
        passkeys is left. Any of the profile's passkeys may confirm, the one being removed
        included. The 404 and 409 refusals come before the proof is checked, and the
        last-way-in rule is checked again after it. Audited as `auth.passkey.remove`. An
        unused device code of the profile is dropped too, so one made with the removed
        passkey cannot add another afterwards.

        Sessions are not tied to the passkey that opened them, so a session it already
        opened carries on; `POST /api/logout/all` ends those.
      parameters:
        - name: id
          in: query
          required: true
          description: The passkey's `id` from the list (its WebAuthn credential id).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '404':
          description: No passkey of this profile has that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "passkey not found", code: "not-found" }
        '409':
          description: It is the profile's last way in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this passkey is the only way into this profile", code: "last-way-in" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/passkeys/options:
    post:
      tags: [passkeys]
      operationId: addPasskeyOptions
      summary: 'Add a passkey (step 1): prove it is you, get creation options'
      description: |
        A session alone is never enough to add a way in that outlives "sign out
        everywhere". The body carries the same proof `POST /api/account/password` takes:
        a passkey assertion made for this request (`cid` from `POST /api/login/options`,
        `credential` signed by one of *this* profile's passkeys), or `current`, the
        profile's password, only while `PASSWORD_LOGIN` is on. With it off, a password
        kept from before is not checked at all and the answer is `passkey-required`, so a
        password-only profile has to move onto a passkey while the flag is still on. Wrong
        passwords count toward the sign-in pause.

        The options use the profile's own user handle and list its passkeys in
        `excludeCredentials`, so an authenticator that already holds one refuses. The
        challenge is good for 5 minutes, for this profile, and only while the session
        version is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string, description: 'One-shot challenge id for /api/account/passkeys/verify.' }
                  options: { $ref: '#/components/schemas/WebAuthnRegistrationOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/passkeys/verify:
    post:
      tags: [passkeys]
      operationId: addPasskeyVerify
      summary: 'Add a passkey (step 2): store the new one'
      description: >-
        Verifies the attestation against the challenge from step 1 and stores the passkey
        on this profile. Audited as `auth.passkey.add`, with the proof that allowed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnRegistrationCredential' }
                name: { type: string, maxLength: 40, description: 'A label of the owner''s choosing ("Work laptop").' }
      responses:
        '200':
          description: Added. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '400':
          description: Challenge expired, replayed or made for another profile, or the attestation did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "challenge expired, try again", code: "challenge-expired" }
        '401':
          description: >-
            Not signed in, including a session that was ended ("sign out everywhere", a
            new password) after step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "not signed in" }
        '409':
          description: '`credential-exists` (that passkey is already registered) or `passkey-limit`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered", code: "credential-exists" }

  /api/account/passkeys/rename:
    post:
      tags: [passkeys]
      operationId: renamePasskey
      summary: Name one passkey
      description: An empty name clears it; the app then shows a numbered "Passkey n".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                name: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Renamed. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No passkey of this profile has that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "passkey not found", code: "not-found" }

  /api/account/device-link:
    post:
      tags: [passkeys]
      operationId: createDeviceLink
      summary: Make a one-time device link
      description: |
        For adding another device of the same person: returns a code of 12 characters from
        the pairing alphabet (60 bits), which the app also shows as a QR code of
        `<app>?link=<code>`. The other device redeems it with `/api/device-link/*` by
        creating a passkey of its own. The code is shown once, stored only as a SHA-256,
        good for 10 minutes and for one passkey; a newer one replaces it, and signing out
        everywhere, a new password, an admin reset or a disable drop it. Same proof as
        adding a passkey. Audited as `auth.link.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: The code, once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expires: { type: number, description: Expiry (ms). }
              example: { code: "K7WQ-2MZP-4HXA", expires: 1790000000000 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/device-link/options:
    post:
      tags: [passkeys]
      operationId: deviceLinkOptions
      summary: 'Redeem a device link (step 1): check the code, get creation options'
      description: |
        Called on the other device, which has no session: the code is the credential.
        Returns creation options for the profile the code belongs to, and that profile's
        id and name. Does not use the code up, so a dismissed passkey prompt can be tried again.
        Wrong codes count toward a per-address pause of link redemption (see
        *Throttling*). **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'Case, spaces and dashes are ignored.' }
            example: { code: "K7WQ-2MZP-4HXA" }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  options: { $ref: '#/components/schemas/WebAuthnRegistrationOptions' }
                  id: { type: string, description: "The profile's id (also the options' user handle). Names are not unique; this is what tells two profiles apart." }
                  name: { type: string, description: The profile this device is being added to. }
        '400': { $ref: '#/components/responses/LinkInvalid' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/device-link/verify:
    post:
      tags: [passkeys]
      operationId: deviceLinkVerify
      summary: 'Redeem a device link (step 2): store the passkey and sign this device in'
      description: |
        Verifies the attestation against the challenge from step 1 (which must have been
        made for this very code), stores the passkey on the code's profile, burns the code
        and sets the session cookie; the passkey just made is what signs the device in.
        Of two requests racing with one code, one wins. Audited as `auth.link.ok`, and every
        refusal as `auth.link.fail`. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, cid, credential]
              properties:
                code: { type: string }
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnRegistrationCredential' }
                name: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Added and signed in.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            `link-invalid` (see below), a challenge that expired or was made for another
            code, or an attestation that did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that code is wrong, used or expired", code: "link-invalid" }
        '409':
          description: '`credential-exists` or `passkey-limit`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered", code: "credential-exists" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/data:
    get:
      tags: [data]
      operationId: getData
      summary: Pull the account's app state
      description: >-
        Returns the caller's entire app state as one JSON blob, or `{"state": null}`
        if nothing has been synced yet, together with `rev`, the server's revision of
        that document (0 when there is none). A client keeps the `rev` it last read or
        wrote and sends it back as `baseRev` on the next push, which lets the server
        refuse a write over a document the client never saw (see the 409 on PUT).
      responses:
        '200':
          description: The stored state, or null, and its revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
                  rev:
                    type: integer
                    description: Server revision of the stored document; 0 when there is none.
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [data]
      operationId: putData
      summary: Push the account's app state
      description: |
        Replaces the stored state wholesale (atomic write; there is no merge on the
        server). The `active` field (an in-progress workout) is stripped before
        saving: a running session belongs to the device running it. Body limit 5 MiB.

        With `baseRev` the write is conditional: it goes through only when `baseRev`
        equals the document's current revision, and answers 409 with the current
        document otherwise; the client merges the two and pushes again with the
        revision it was given. Without `baseRev` the write is unconditional (clients
        from before revisions, and deliberate replaces such as a backup import). The
        server stamps the new revision into the document as `_rev`; a `_rev` sent by
        the client is ignored.

        The records of removals (`deleted`) and of edits (`edited`) never shrink: the
        stored ones are joined into the write (a reset keeps its own). A writer that does
        not stamp its own changes (no `stamped: true`; an API script, an older app) and
        sends the current `baseRev` gets them stamped by the server, at the server's time:
        every entry it removed (a workout, routine, custom exercise, weigh-in, card,
        profile or favourite), every setting and plan day it changed (`queue`,
        `week.<day>`, …), and every entry it edited (`_ts`, per field `_f`). That keeps a
        planner's new week, or a routine it removed, from being undone by a phone that
        reconnects later with an older change. A setting, plan day or entry field whose
        stored stamp (`edited`, `_f`) is later than the one the writer sends back keeps the
        stored value: the writer never saw that change, so send back the `edited` and `_f`
        you read. A writer that sends no `edited` at all is not held to it. An entry the document holds while a
        removal on record says it was deleted after its last edit is kept and marked as
        added back.

        Such a writer also cannot delete what it does not know: a field of the stored
        document, of a stored routine, workout, custom exercise, card or profile, of a
        routine's exercise, or of a logged exercise or set that its copy leaves out comes
        back from the stored copy (an older app rebuilds an exercise from the fields it
        knows, which dropped pyramid sets made on an updated device). Only the fields
        v1.3.9 itself removes (a superset link, a note, a cleared set value, …) can be
        removed this way. Send `stamped: true` to remove anything else.

        Every accepted write also starts the grace period of each stored file (tag `media`)
        the new state no longer references, and stops it for each one it references again.
        That bookkeeping never changes the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/State' }
                baseRev:
                  oneOf: [{ type: integer }, { type: 'null' }]
                  description: >-
                    The revision this client last read or wrote. Omit or null for an
                    unconditional overwrite.
                baseWid:
                  type: string
                  description: >-
                    The write id (`_wid`) of the document this client last read or wrote. With
                    `baseRev`, a write over a different document at the same revision (the data
                    directory went back in time and the number was reached again) answers 409.
                stamped:
                  type: boolean
                  description: >-
                    True when the client stamps its own changes in `deleted`, `edited` and
                    each entry's `_ts`/`_f`, as the app does. Omit it to have the server
                    stamp what changed against the stored document.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  ts:
                    oneOf: [{ type: number }, { type: 'null' }]
                    description: Echo of the pushed state's `_ts`, if present.
                  rev:
                    type: integer
                    description: >-
                      The revision the write produced. For a writer that does not stamp, when the
                      server put back something it left out or set back, the document is stored one
                      revision further, so the writer's next check of the revision reads it again.
                      `wid` is the stored document's either way.
                  wid:
                    type: string
                    description: The write id (`_wid`) of the stored document.
        '409':
          description: >-
            `baseRev` is not the current revision: another client wrote since this one
            last read. Carries the current document so the client can merge and retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: conflict }
                  rev: { type: integer }
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
        '400':
          description: >-
            `state` missing or not an object, `state` an array or an object with nothing of
            the profile in it (`_rev`/`_ts` do not count; both would empty the profile), or
            `workouts`/`routines` set to anything other than an array or null. Entries inside
            those two arrays that are not objects (`null`, numbers, nested arrays) are dropped
            before the write rather than refused, so a client with a damaged copy still syncs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing: { value: { error: "state required" } }
                invalid: { value: { error: "invalid state" } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/data/rev:
    get:
      tags: [data]
      summary: Current revision of the caller's profile state
      description: |
        The `rev` that `GET /api/data` would return, without the document. Signed-in clients poll
        this while open and on every return to the foreground and fetch the document only when
        the number changed.
      responses:
        '200':
          description: The current revision (0 when the profile has no state yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
                  wid: { type: string, description: 'The write id (`_wid`) of the stored document; absent before its first write.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/media/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        description: The SHA-256 of the file's bytes, 64 lowercase hex characters.
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    get:
      tags: [media]
      operationId: getMedia
      summary: Download one of your photos or videos
      description: |
        The stored file, whole, from the caller's own folder only: another profile's file
        answers exactly like one that was never uploaded (404). The body is the file, not
        JSON, with headers that keep a browser from ever treating it as a page:
        `Content-Type` from the sniffed type (never `text/*` or SVG),
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: default-src 'none'; sandbox`,
        `Cross-Origin-Resource-Policy: same-origin`, `Content-Disposition: inline`,
        `X-Robots-Tag: noindex` and `Cache-Control: private, no-store`. The app keeps its own
        verified copy, and an HTTP-cache copy would outlive signing out.

        No `Range` and no `ETag`: the app downloads a file once, checks it against its hash and
        keeps it. A paired phone fetches with its bearer token; `<img src>` cannot carry one.
        Not throttled.
      responses:
        '200':
          description: The file.
          headers:
            Content-Length: { schema: { type: integer } }
            Content-Disposition: { schema: { type: string }, example: 'inline; filename="<hash>.webp"' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Not in the caller's folder. Never uploaded, removed by the sweep, or someone else's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such file", code: "media-missing" }
    put:
      tags: [media]
      operationId: putMedia
      summary: Upload one photo, GIF or video
      description: |
        The body is the raw file; `Content-Type` must be one of the seven types below and
        `Content-Length` is optional (chunked uploads are capped while they stream). The path
        names the SHA-256 of the bytes, and the file is stored only if they hash to it.
        Idempotent: uploading a file the server already has answers 200 with `existed: true`.

        What is stored is decided by the file's first bytes, not by the declared type. The
        declared type only has to be in the same category, a still (JPEG, PNG, WebP, GIF) or a
        video (MP4, MOV, WebM): a JPEG declared as a GIF is stored as the JPEG it is, a video
        declared as an image is refused. The cap of the kind the bytes turned out to be applies
        (`MEDIA_IMAGE_MAX_MB`, `MEDIA_GIF_MAX_MB`, `MEDIA_VIDEO_MAX_MB`), and an MP4 or MOV must
        be a well-formed file no longer than `MEDIA_VIDEO_MAX_SEC` (+1 s), read from its
        headers. HEIC/AVIF, SVG, HTML and every other type are refused; the app converts HEIC
        photos before uploading. The server never decodes or alters a file: the app has already
        re-encoded photos and removed video metadata on the device.

        Checked in this order: session (401), the hourly budget and at most two uploads at once
        per profile (429), the declared type (415), a declared length over the cap (413 before
        a byte is read), already stored (200), the quota (413 `media-quota`; files the profile
        already dropped get one hour instead of the grace to make room), free disk (507), then
        while and after streaming: size (413), hash (400), sniffed type (415), sniffed cap
        (413), video checks (415/413). No bytes for 60 s ends the upload with 408. A refused
        upload is read and discarded up to twice its cap, so the answer reaches the client.

        A new file that the profile's state does not reference yet starts its grace period
        at once, so a state push that never comes does not keep it forever.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/quicktime: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaStored' }
              example: { ok: true, hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", mime: "image/webp", size: 183204, existed: false }
        '200':
          description: The server already had these bytes (from this or another of your devices).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaStored' }
              example: { ok: true, hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", mime: "image/webp", size: 183204, existed: true }
        '400':
          description: The bytes do not hash to the name in the path (`hash-mismatch`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the file does not match its name", code: "hash-mismatch" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }
        '408':
          description: No bytes arrived for 60 seconds (`timeout`). The connection is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the upload stalled", code: "timeout" }
        '413':
          description: |
            - `media-too-large`: over the cap of its kind; `maxMB` says the cap.
            - `media-quota`: the profile's space is full; `usedMB` and `quotaMB` say how full.
            - `media-too-long`: a video longer than `maxSec` seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLarge: { value: { error: "that file is too large", code: "media-too-large", maxMB: 2 } }
                quota: { value: { error: "your space for photos and videos is full", code: "media-quota", usedMB: 199.4, quotaMB: 200 } }
                tooLong: { value: { error: "that video is too long", code: "media-too-long", maxSec: 60 } }
        '415':
          description: >-
            `media-type`: the declared type is not one of the seven, the bytes are none of
            them, or they are a video declared as an image (or the reverse). `media-invalid`:
            an MP4 or MOV whose boxes do not add up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                type: { value: { error: "that file type is not accepted", code: "media-type" } }
                invalid: { value: { error: "that video could not be read", code: "media-invalid" } }
        '429':
          description: >-
            `locked`: more than `MEDIA_UPLOADS_PER_HOUR` uploads this hour; `busy`: two
            uploads of this profile are already in flight (`retryAfter` 5).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                locked: { value: { error: "too many uploads, try again later", code: "locked", retryAfter: 1740 } }
                busy: { value: { error: "too many uploads at once, try again in a moment", code: "busy", retryAfter: 5 } }
        '507':
          description: The server's disk has less than `MEDIA_MIN_FREE_MB` free (`storage-full`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the server is running out of disk space", code: "storage-full" }

  /api/media/missing:
    post:
      tags: [media]
      operationId: mediaMissing
      summary: Which of these files the server does not have
      description: |
        The app sends every hash its state references and uploads only what comes back, so the
        same call moves a guest's files into a new account, a phone's into its pairing, a
        backup's into the server, and re-sends a file the sweep removed while a device still
        had it. Answered from the caller's own folder only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  maxItems: 1000
                  items: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: The subset the server does not have, in the order sent, and the profile's usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  missing:
                    type: array
                    items: { type: string }
                  usage: { $ref: '#/components/schemas/MediaUsage' }
              example: { missing: ["b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9"], usage: { bytes: 52428800, count: 14, quotaBytes: 209715200 } }
        '400':
          description: '`hashes` is missing, not a list, longer than 1000, or holds something that is not a lowercase SHA-256 (`bad-request`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }

  /api/media/sweep:
    post:
      tags: [media]
      operationId: mediaSweep
      summary: Delete every file your current state does not reference
      description: |
        What "Reset everything" does after pushing the empty state: every stored file of the
        caller that the stored state does not reference goes now, without the grace period.
        A state that cannot be read removes nothing. At most 10 an hour per profile (429
        `locked`). Recorded in the activity log as `media.sweep`.

        Without this call nothing is lost either: the hourly sweep removes a file once the
        state has not referenced it for `MEDIA_GC_GRACE_DAYS` days (14), and only for profiles
        whose state reads. A missing or unreadable state, or a profile missing from `db.json`,
        never deletes anything.
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example: {}
      responses:
        '200':
          description: What was removed, and what is left.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
                  freedBytes: { type: integer }
                  usage: { $ref: '#/components/schemas/MediaUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }
        '429':
          description: More than 10 sweeps this hour (`locked`).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "too many uploads, try again later", code: "locked", retryAfter: 1200 }

  /api/push/public-key:
    get:
      tags: [push]
      operationId: pushPublicKey
      summary: VAPID public key
      description: >-
        The instance's Web-Push application server key (generated once at first boot),
        for `PushManager.subscribe({applicationServerKey})`. Public.
      security: []
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: base64url-encoded P-256 public key.

  /api/push/subscribe:
    post:
      tags: [push]
      operationId: pushSubscribe
      summary: Register a Web-Push subscription
      description: |
        Stores the browser's `PushSubscription` for this account. Only `endpoint` and
        the two protocol keys are kept. The endpoint must be a public `https://` URL;
        private/loopback/link-local addresses are refused (here and again at send
        time, against DNS rebinding). At most 20 subscriptions per user; the oldest
        are dropped first. Re-subscribing an existing endpoint replaces it and keeps
        its original `created`. The client re-sends its subscription on every
        signed-in boot, so a row the instance lost comes back on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: '#/components/schemas/PushSubscription' }
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: >-
                    A token the browser made up for itself (stored in its localStorage),
                    so rest-timer pushes can be aimed at the device that started the
                    rest. Optional; anything that is not a short token is ignored, and a
                    re-send of an endpoint without one keeps the id its row already has.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Malformed subscription, or an endpoint that isn't acceptable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                malformed: { value: { error: "invalid subscription" } }
                private: { value: { error: "endpoint must not point at a private address" } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/status:
    get:
      tags: [push]
      operationId: pushStatus
      summary: Does the server hold this subscription?
      description: >-
        Whether the caller's account has a stored subscription with exactly this
        `endpoint`. The browser's `PushManager.getSubscription()` says nothing about
        the server's side: a row pruned after a dead send (404/410/403) leaves the
        browser subscribed to nowhere. So the client asks here before showing the
        notifications switch as on, and re-registers when the answer is no. A stored
        subscription also names the `deviceId` it is stored with, and the client
        re-registers when that is not its own: a row stored without one (from before
        device ids) sends that device's rest-timer alerts to every subscription of the
        account.
      parameters:
        - in: query
          name: endpoint
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties:
                  subscribed: { type: boolean }
                  deviceId:
                    type: ['string', 'null']
                    description: >-
                      Present when `subscribed` is true: the device id the subscription is
                      stored with, `null` when it has none.
              examples:
                stored: { value: { subscribed: true, deviceId: "3f9c1d2e7b0a4c6d9e8f1a2b3c4d5e6f" } }
                storedWithoutDevice: { value: { subscribed: true, deviceId: null } }
                notStored: { value: { subscribed: false } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/unsubscribe:
    post:
      tags: [push]
      operationId: pushUnsubscribe
      summary: Remove a Web-Push subscription
      description: Removes the caller's subscription with the given endpoint. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '200':
          description: Removed (or was never there).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/test:
    post:
      tags: [push]
      operationId: pushTest
      summary: Send a test notification
      description: >-
        Sends a test push to all of the caller's subscriptions (localized with the
        `lang` in their synced state). Returns 200 even if delivery to individual
        endpoints fails; dead endpoints (404/410, and 403 for a subscription made
        against a VAPID key the instance no longer has) are pruned as a side effect.
      responses:
        '200':
          description: Sends attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer:
    post:
      tags: [push]
      operationId: pushRestTimer
      summary: Schedule a server-side rest-timer push
      description: |
        Schedules one push after `seconds` (a number or numeric string ≥ 1, clamped to
        3600). One pending timer per
        device, keyed by `deviceId`, the same token the subscription was registered with; a
        new call from the same device replaces it, and the push goes only to that
        device's subscriptions. Without a `deviceId` there is one timer per account
        and the push goes to every subscription, as before. The client schedules this
        on rest start/extend and cancels on skip or on-screen completion. The push
        only actually fires when the tab was backgrounded/suspended and never got to
        cancel it. Timers live in memory: an API restart drops them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: number
                  minimum: 1
                  maximum: 3600
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: The browser's own token, see `POST /api/push/subscribe`. Optional.
            example: { seconds: 90, deviceId: "3f9c1d2e7b0a4c6d9e8f1a2b3c4d5e6f" }
      responses:
        '200':
          description: Timer scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: '`seconds` missing, not numeric, or below 1. Nothing is scheduled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "seconds required" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer/cancel:
    post:
      tags: [push]
      operationId: pushRestTimerCancel
      summary: Cancel the pending rest-timer push
      description: >-
        Cancels the caller's scheduled rest-timer push, if any. With a `deviceId` only
        that device's timer; without one, every pending timer of the account. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
      responses:
        '200':
          description: Cancelled (or nothing was pending).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/activity:
    post:
      tags: [activity]
      operationId: postActivity
      summary: Live-workout presence heartbeat
      description: |
        The client pings this every ~20 s while a workout is on screen; the admin
        dashboard reads who is training right now. Purely ephemeral, in-memory, never
        persisted; entries expire 70 s after the last ping. `{"active": false}` is the
        "left" signal: with `reason` `navigated` or `closed`, or with no reason, it
        drops the caller's entry immediately. With `reason: hidden` (the page went to
        the background) it marks the entry away instead, and the entry stops being
        listed 45 s after that mark unless a heartbeat arrives first; a heartbeat
        clears the mark. The 70 s expiry applies either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: false ends the presence (see `reason`); true (with the fields below) updates it.
                reason:
                  type: string
                  enum: [navigated, closed, hidden]
                  description: >-
                    Why the client sent `active: false`: `navigated` (an in-app route
                    change), `closed` (the page is going away) or `hidden` (the page went
                    to the background). `navigated` and `closed` drop the entry at once,
                    as no reason does; `hidden` marks it away rather than dropping it.
                    Ignored with `active: true`.
                name:
                  type: string
                  maxLength: 60
                  description: Routine/workout name being trained.
                exIdx: { type: integer, description: Current exercise index (0-based). }
                exTotal: { type: integer, description: Exercises in the workout. }
                setsDone: { type: integer }
                setsTotal: { type: integer }
                startedAt:
                  type: number
                  description: Workout start, ms since epoch (defaults to now).
            example:
              active: true
              name: "Push Day"
              exIdx: 2
              exTotal: 5
              setsDone: 7
              setsTotal: 16
              startedAt: 1756500000000
      responses:
        '200':
          description: Presence updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminUsers
      summary: 'Admin: list all users'
      description: >-
        One row per user with workout counts, last sync, push status and live
        presence. `workouts` counts only the entries the drill-down can show.
        Admin only.
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserRow' }
                  invite_only: { type: boolean }
                  password_login: { type: boolean, description: Present (true) with PASSWORD_LOGIN=1. }
                  now:
                    type: number
                    description: Server time (ms), for rendering relative times.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/user:
    get:
      tags: [admin]
      operationId: adminUser
      summary: 'Admin: one user in detail'
      description: >-
        Drill-down: full workout history (newest first) and body-weight log for one
        user. Admin only. Anything in `routines`, `bodyweight` or `workouts` that is not
        an object is left out, and a list that is not an array reads as empty: PUT
        /api/data drops those entries now, but a state file written before it did still
        has them and this route has to answer for it. A workout's `media` (its photos and
        videos) is left out: they are the owner's own.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: The user id.
      responses:
        '200':
          description: The user's detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/user/disable:
    post:
      tags: [admin]
      operationId: adminUserDisable
      x-centers-constraints: Last enabled manager or platform administrator cannot be disabled; SQL unavailable fails closed.
      summary: 'Admin: disable or re-enable a user'
      description: |
        Sets the `disabled` flag. A disabled account is locked out everywhere at once
        (every existing session stops resolving) and dropped from live presence.
        Admins cannot be disabled. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, disabled]
              properties:
                id: { type: string, description: The user id. }
                disabled: { type: boolean }
      responses:
        '200':
          description: Flag updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string }
                  disabled: { type: boolean }
        '400':
          description: Target is an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cannot disable an admin" }
        '409': { description: Last enabled manager or platform administrator. }
        '503': { description: Centers references could not be checked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/user/delete:
    post:
      tags: [admin]
      operationId: adminUserDelete
      summary: 'Admin: delete a user and everything of theirs'
      description: |
        Removes the account for good: the user record, their passkeys, their push
        subscriptions, their live presence, their training history file, their uploaded
        photos and videos (`DATA_DIR/uploads/<uid>/`) and any Coach credential stored for
        them. Not reversible; `/api/admin/user/disable` is the
        reversible one. An admin cannot delete their own account, and the last admin
        cannot be deleted. Audited by name, since the id stops meaning anything.
        Once centers has been attached, a durable marker keeps SQL-reference checks
        active even if the centers UI is switched off. Linked accounts are refused
        with 409; unavailable SQL fails closed with 503. Unlinked legacy accounts
        keep the same deletion behavior. Linking and deletion share a process-local lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The user id. }
      responses:
        '200':
          description: The account and everything of theirs is gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string }
        '400':
          description: Your own account, or the last admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "you cannot delete your own account" }
        '409':
          description: Account has administrative references (account-linked), or is currently being linked/deleted (account-busy).
        '503':
          description: Center references could not be checked; centers-unavailable. No deletion is performed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/invites:
    get:
      tags: [admin]
      operationId: adminInvites
      summary: 'Admin: list invite codes'
      description: All invite codes, with the redeeming user's name resolved for display.
      responses:
        '200':
          description: All invites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
                  invite_only: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/invites/new:
    post:
      tags: [admin]
      operationId: adminInviteNew
      summary: 'Admin: mint an invite code'
      description: >-
        Creates a fresh single-use invite code (16 hex chars = 64 bits; the code
        itself is the thing that isn't worth guessing; rate limiting is the reverse
        proxy's job). Audited.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 60
                  description: Free-form label ("for Alex").
      responses:
        '200':
          description: The new invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/invites/revoke:
    post:
      tags: [admin]
      operationId: adminInviteRevoke
      summary: 'Admin: revoke an unused invite code'
      description: Deletes an unused code. A code that was already redeemed cannot be revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: The code was already used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "already used, cannot revoke" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such code" }

  /api/admin/audit:
    get:
      tags: [admin]
      operationId: adminAudit
      summary: 'Admin: read the activity log'
      description: |
        The audit log (sign-ins, failed attempts, admin actions), newest first, paged
        by event id (`before` cursor; offset paging would repeat rows as new events
        land). Retention (`AUDIT_MAX` events / `AUDIT_DAYS` days) is applied on read
        as well as on the hourly compaction. When `AUDIT_LOG` is off the route still
        answers, with `enabled: false` and whatever was logged before.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
          description: Page size.
        - name: before
          in: query
          schema: { type: integer }
          description: Only events with id < before (cursor from `nextBefore`).
        - name: cat
          in: query
          schema:
            type: string
            enum: [auth, admin, fail]
          description: >-
            Filter: `fail` keeps only failed events; any other value keeps events
            whose name starts with `<cat>.` (in practice `auth` or `admin`).
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  total:
                    type: integer
                    description: Rows matching the filter (after retention).
                  nextBefore:
                    oneOf: [{ type: integer }, { type: 'null' }]
                    description: Cursor for the next page; null on the last page.
                  enabled:
                    type: boolean
                    description: Whether audit logging is currently on (AUDIT_LOG).
                  ip_mode:
                    type: string
                    enum: [off, net, full]
                    description: How much of the caller IP is recorded (AUDIT_IP).
                  retention:
                    type: object
                    properties:
                      max: { type: integer, description: 'Event cap (0 = none).' }
                      days: { type: integer, description: 'Age cap in days (0 = none).' }
                  now: { type: number, description: Server time (ms). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit/clear:
    post:
      tags: [admin]
      operationId: adminAuditClear
      summary: 'Admin: clear the activity log'
      description: >-
        Deletes the log file. The clear is itself the first event of the fresh log,
        and event ids are never reset, so a wipe always leaves a visible id gap.
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- AI Coach
  # The routes live in api/coach/routes.js and are mixed into the same route table as
  # everything above; they are inert (503) while the instance has no Coach enabled
  # and connected.

  /api/coach/disclosure:
    get:
      tags: [coach]
      operationId: getCoachDisclosure
      summary: What the consent screen must say
      description: |
        The categories of data a Coach job would send, and the provider it would go to,
        read straight from the module that builds the payload, so the consent screen
        cannot drift from what actually leaves the box.

        Needs a session but *not* a connected Coach: the screen that collects consent
        runs before there is anything to consent to.
      responses:
        '200':
          description: The disclosure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, description: "Provider id, e.g. `anthropic`." }
                  providerLabel: { type: string }
                  categories:
                    type: array
                    items: { type: string, enum: [plan, training, bodyweight, profile, prefs] }
                    description: The data categories a job may send. Nothing else ever is.
                  version: { type: integer, description: Disclosure version the consent is recorded against. }
              example:
                provider: anthropic
                providerLabel: Claude
                categories: [plan, training, bodyweight, profile, prefs]
                version: 1
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/status:
    get:
      tags: [coach]
      operationId: getCoachStatus
      summary: The running job, the waiting proposal and today's budget
      description: |
        What the Coach screen polls. Also the only place a proposal past its 14-day
        expiry is retired. A phone that stays closed never polls, so nothing else
        would notice.
      responses:
        '200':
          description: This profile's Coach state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/plan:
    post:
      tags: [coach]
      operationId: postCoachPlan
      summary: Ask for a training plan
      description: |
        Queues a `create` job. With `intake` it builds a plan from the answers given on
        the intake screen; with `refine` it reworks the proposal already waiting, in the
        words of the person reading it. The answer is 202 and a job id; the result
        arrives through `GET /api/coach/status`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                intake:
                  $ref: '#/components/schemas/CoachIntake'
                refine:
                  type: string
                  maxLength: 4000
                  description: |
                    A change asked for in plain words, applied to the proposal now waiting. Cut to
                    the instance's `maxMessageLen` (1000 unless the admin changed it; 200–4000).
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
            example: { intake: { goal: muscle, experience: novice, daysPerWeek: 3, equipment: [dumbbell, barbell] } }
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/review:
    post:
      tags: [coach]
      operationId: postCoachReview
      summary: Ask for a review of the training since the last one
      description: |
        Queues a `review` job, the same job the weekly cadence queues on its own. The
        answer is either a change-set to accept or reject, or "nothing to change" with
        the reason, both delivered through `GET /api/coach/status`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: |
                    Anything the profile wants the Coach to know this time round. Cut to the
                    instance's `maxMessageLen` (1000 unless the admin changed it; 200–4000).
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/debrief:
    post:
      tags: [coach]
      operationId: postCoachDebrief
      summary: Ask for a read of one session
      description: |
        Queues a `debrief` job: one workout, read closely. It changes nothing; the card
        it produces is kept in the profile's log. With no `workoutId` the most recent
        session is read.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutId:
                  oneOf: [{ type: string, maxLength: 40 }, { type: 'null' }]
                  description: The workout to read; null or absent means the latest.
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/pending/resolve:
    post:
      tags: [coach]
      operationId: postCoachResolve
      summary: Apply or discard the waiting proposal
      description: |
        The client applies the accepted changes to its own state and syncs them through
        `PUT /api/data`; this only records the decision and clears the proposal. Sending
        it when nothing is waiting is a no-op, not an error.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: array
                  items: { type: string }
                  description: Ids of the changes the person kept.
                rejected:
                  type: array
                  items: { type: string }
                  description: Ids of the changes they turned down.
                dismissed:
                  type: boolean
                  description: True when the whole proposal was thrown away unread.
      responses:
        '200':
          description: Recorded; the proposal is cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort:
    get:
      tags: [coach]
      operationId: getCoachCohort
      summary: How this profile sits against the others who opted in
      description: |
        Medians only, and only when at least three profiles on the instance share. Nothing
        at all for a profile that does not share itself, or on an instance where the admin
        has not switched the comparison on. Each of those is a 200 saying which it is.
      responses:
        '200':
          description: The comparison, or the reason there isn't one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachCohort' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort/share:
    post:
      tags: [coach]
      operationId: postCoachCohortShare
      summary: Opt this profile in or out of the comparison
      description: >-
        Held server-side rather than in the synced state: this flag decides whether the
        profile's numbers reach other people, and a stale device syncing an older copy
        must not be able to turn it back on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share: { type: boolean }
            example: { share: true }
      responses:
        '200':
          description: The flag as it now stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  sharing: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/account:
    get:
      tags: [coach]
      operationId: getCoachAccount
      summary: Whose provider account this profile would spend
      description: >-
        Its own route because both the Coach screen and the admin card have to state it,
        and neither should be inferring it from settings. In instance mode a personal
        credential binds to the first profile that spends it; every other profile is
        refused outright rather than warned, and `reason` says so.
      responses:
        '200':
          description: The account this profile's jobs would run on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [instance, profile] }
                  provider: { type: string }
                  providerLabel: { type: string }
                  account:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: What the admin labelled the credential, when there is one.
                  connected: { type: boolean }
                  reason:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: Why not, when `connected` is false (e.g. `shared-account`).
                  message:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: The refusal in the app's own voice, ready to show.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/forget:
    post:
      tags: [coach]
      operationId: postCoachForget
      summary: Drop everything the server holds for this profile
      description: |
        Consent withdrawn, or the Coach switched off for this profile: the job record,
        the waiting proposal, the history and the sharing flag go at once, without waiting
        for a sync to carry the news. A job already running is cancelled where the adapter
        allows it and writes nothing back either way.

        Today's job count is the one thing that survives. It is the spending record the
        daily cap reads, and forgetting must not hand out a fresh cap.

        Needs a session only: a profile must be able to be forgotten on an instance whose
        Coach has since been switched off.
      responses:
        '200':
          description: Forgotten.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/coach:
    get:
      tags: [admin, coach]
      operationId: getAdminCoach
      summary: 'Admin: the Coach card'
      description: |
        Everything the admin screen renders in one round trip, including a live check of
        the configured provider: for a runtime provider "is the runtime there", for an
        HTTPS one the model list its stored key can see.

        Counts and outcomes only: no intake answers, no payloads, no proposals, and never
        a credential, only whether one is filed and what it is labelled.
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoach' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/config:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachConfig
      summary: 'Admin: change the Coach settings'
      description: |
        A patch: every field is optional and only what is sent is changed. Model,
        endpoint and credential are all keyed by provider, so switching provider never
        drops any of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, description: "Must be one of the ids GET /api/admin/coach lists." }
                model:
                  type: string
                  maxLength: 80
                  description: For the provider being set (or the current one). Empty string clears it.
                baseUrl:
                  type: string
                  description: |
                    Only for a provider with a configurable endpoint; validated before it is stored.
                    Empty means "back to the default", so it is refused for a provider that has none.
                community: { type: boolean, description: Offer the cohort comparison on this instance. }
                caps:
                  type: object
                  properties:
                    perProfileDaily: { type: integer, minimum: 0, maximum: 200, description: 0 = no cap. }
                    instanceDaily: { type: integer, minimum: 0, maximum: 5000, description: 0 = no cap. }
                maxMessageLen:
                  type: integer
                  minimum: 200
                  maximum: 4000
                  description: How long a chat message, refinement or review note can be. Clamped into the range; not a number keeps the current value.
            example: { enabled: true, provider: compatible, model: qwen3.8-27b, caps: { perProfileDaily: 10, instanceDaily: 0 } }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: |
            Unknown provider, an endpoint set on a provider that has a fixed one, a base URL that
            did not validate, or an empty one for a provider with no default endpoint to fall back
            to (`compatible`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown provider" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/test:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachTest
      summary: 'Admin: run one round trip against the provider'
      description: |
        Checks the runtime, then asks the model for one fixed JSON object and validates
        the shape that comes back. That is the whole path a job takes, on nobody's profile.

        Always 200: the outcome is in the body, because "the provider refused" is an
        answer to the question the button asks, not a failure of the request. An HTTPS
        provider gets the same retries as a job: a 429, 500, 502, 503, 504 or 529 is
        tried twice more, after pauses of 2 and 5 seconds, and only then reported. A
        runtime provider is asked once.
      responses:
        '200':
          description: The result of the round trip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version:
                    type: string
                    description: What the runtime reported, when it could be asked.
                  error:
                    type: string
                    description: Present when `ok` is false. The provider's own words, trimmed.
              examples:
                ok: { value: { ok: true, version: "1.2.3" } }
                refused: { value: { ok: false, error: "401 invalid x-api-key" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/models:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachModels
      summary: 'Admin: list the models the endpoint serves'
      description: >-
        So the card can offer a list rather than a text field that goes stale with every
        model release. HTTPS providers only; a provider that cannot be asked answers
        `ok: false` with an empty list rather than an error status.
      responses:
        '200':
          description: The models, or why there are none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  models:
                    type: array
                    items: { type: string }
                  error: { type: string }
              example: { ok: true, models: [qwen3.8-27b, gpt-oss-120b] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/connect:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachConnect
      summary: 'Admin: file the provider credential'
      description: |
        The token is accepted once and never read back: it is encrypted with the
        instance secret and leaves again only as an environment variable on a job's child
        process. `type` has to match a variable the provider actually declares, so a key
        for one provider cannot be filed under another and then silently go nowhere.

        A key may be filed for a provider that is not the active one, so the chips can be
        prepared before switching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, token]
              properties:
                provider: { type: string, description: Defaults to the active provider. }
                type:
                  type: string
                  enum: [cli-token, oauth, apikey]
                token: { type: string, description: "Never returned by any route, ever." }
                account:
                  type: string
                  maxLength: 120
                  description: A label for whose account this is, shown on the card.
            example: { type: apikey, token: "sk-…", account: "team@example.com" }
      responses:
        '200':
          description: Filed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Unknown provider, a credential type that provider does not take, or no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no token supplied" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/disconnect:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachDisconnect
      summary: 'Admin: remove the provider credential'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, description: Defaults to the active provider. }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Unknown provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown provider" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gymsid
      description: |
        HMAC-signed session cookie, set by `register/verify` / `login/verify`.
        On HTTPS deployments it is issued as **`__Host-gymsid`** (host-locked,
        Secure); the unprefixed `gymsid` is what a plain-http `localhost` instance
        uses, and is still accepted for pre-upgrade sessions. HttpOnly + SameSite=Lax;
        browser clients never handle the value directly.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The same signed session token, carried as `Authorization: Bearer <token>` by
        the paired mobile app (obtained from `POST /api/pair/redeem`). Bearer requests
        skip the CSRF origin check; a browser never attaches this header on its own.

  responses:
    Unauthorized:
      description: No session, expired/revoked session, or a disabled account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not signed in" }
    Forbidden:
      description: Signed in, but not an admin. The attempt is recorded in the audit log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "forbidden" }
    CoachOff:
      description: >-
        The Coach is not set up on this instance (switched off, or no provider connected).
        Every Coach route answers this rather than pretending, so an unconfigured instance
        renders exactly the app it was before the feature existed. `code` is `off`, the
        class a job refused at enqueue for the same reason carries; the app shows its own
        line for it.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [off] }
          example: { error: "the Coach is not set up on this instance", code: off }
    CoachJobQueued:
      description: >-
        Queued. The job runs in the background; its outcome arrives through
        `GET /api/coach/status`, which the client polls.
      content:
        application/json:
          schema:
            type: object
            properties:
              job:
                type: object
                properties:
                  id: { type: string, description: 16 hex characters. }
          example: { job: { id: "9f1c2d3e4a5b6c7d" } }
    CoachRefused:
      description: |
        The Coach will not take this job, and says which reason in `code`:

        - `busy` (409): a job for this profile is already running.
        - `shared` (409): instance mode, and the credential belongs to another profile.
        - `cap` (429): this profile's or the instance's daily limit is spent.
        - `consent` (403): no consent recorded for this profile.
        - `unprivileged` (503): the privilege drop cannot be performed, so no job runs.

        The message is the one to show; the raw provider detail never reaches the user.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [off, busy, cap, consent, shared, unprivileged] }
          example: { error: "the Coach is already thinking about your training", code: busy }
    TooManyRequests:
      description: >-
        Paused by the sign-in throttle (see *Throttling* in the description). The request
        was not looked at; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the pause ends.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "too many attempts, try again later", code: "locked", retryAfter: 60 }
    Busy:
      description: Every password check slot and the short queue behind them are taken.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the server is busy, try again in a moment", code: "busy" }
    PasswordPolicy:
      description: >-
        The new password breaks the policy (`too-short` under 10 characters,
        `too-long` over 256, or `too-common`), or a field is `missing`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "this password is too easy to guess", code: "too-common" }
    NameTaken:
      description: >-
        Another profile already signs in with this name, or holds it with a reset code
        that has not been used or expired yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "another profile already signs in with this name", code: "name-taken" }

    ProofRefused:
      description: >-
        No acceptable proof that the owner is here: `passkey-required` (no password that
        counts, because none is set or `PASSWORD_LOGIN` is off, so a passkey has to confirm),
        `passkey` (the assertion did not verify, belongs to another profile, or was made
        for another challenge, one handed out for another ceremony or one already used),
        `current-required` or `current-wrong`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "confirm with your passkey first", code: "passkey-required" }
    PasskeyLimit:
      description: The profile already has the most passkeys it can have (20).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "a profile can have at most 20 passkeys", code: "passkey-limit" }
    LinkInvalid:
      description: >-
        The code is wrong, used, replaced or expired, or its profile is gone or disabled:
        one answer for all of them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "that code is wrong, used or expired", code: "link-invalid" }

  schemas:
    ExactAggregate:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Exact nonnegative decimal integer; parse with arbitrary precision, never floating point. Monetary aggregates are EUR cents, without a per-payment upper bound.
    CenterMetrics:
      type: object
      additionalProperties: false
      required: [definitionVersion, currency, capturedAt, dateBasis, centerCount, period, current]
      properties:
        definitionVersion: { type: integer, const: 1 }
        currency: { type: string, const: EUR }
        capturedAt: { type: string, format: date-time }
        dateBasis: { type: string, const: center-local-calendar }
        centerCount: { $ref: '#/components/schemas/ExactAggregate' }
        period:
          type: object
          additionalProperties: false
          required: [from, to, registeredMembers, activations, terminations, receiptsIssued, receiptTotalMinor, collectionsMinor, refundsMinor, netCollectionsMinor]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            registeredMembers: { $ref: '#/components/schemas/ExactAggregate' }
            activations: { $ref: '#/components/schemas/ExactAggregate' }
            terminations: { $ref: '#/components/schemas/ExactAggregate' }
            receiptsIssued: { $ref: '#/components/schemas/ExactAggregate' }
            receiptTotalMinor: { $ref: '#/components/schemas/ExactAggregate' }
            collectionsMinor: { $ref: '#/components/schemas/ExactAggregate' }
            refundsMinor: { $ref: '#/components/schemas/ExactAggregate' }
            netCollectionsMinor:
              type: string
              pattern: '^(0|-?[1-9][0-9]*)$'
              description: Registered collections minus refunds in EUR cents. May be negative; not profit or a bank settlement.
        current:
          type: object
          additionalProperties: false
          description: Current snapshot, independent of the selected flow period. Contracts include frozen memberships and do not imply entry permission.
          required: [members, active, frozen, ended, preactive, subscriptions, outstandingMinor, overdueMinor, overduePolicyComplete]
          properties:
            members: { $ref: '#/components/schemas/ExactAggregate' }
            active: { $ref: '#/components/schemas/ExactAggregate' }
            frozen: { $ref: '#/components/schemas/ExactAggregate' }
            ended: { $ref: '#/components/schemas/ExactAggregate' }
            preactive: { $ref: '#/components/schemas/ExactAggregate' }
            subscriptions: { $ref: '#/components/schemas/ExactAggregate' }
            outstandingMinor: { $ref: '#/components/schemas/ExactAggregate' }
            overdueMinor:
              oneOf:
                - { $ref: '#/components/schemas/ExactAggregate' }
                - { type: 'null' }
              description: Unknown if a positive balance has no supported debt policy. Never silently substitute zero.
            overduePolicyComplete: { type: boolean }
    CenterAccessPolicy: {"type":"object","additionalProperties":false,"required":["enabled","requireSubscription","denyOverdue","graceDays"],"properties":{"enabled":{"type":"boolean"},"requireSubscription":{"type":"boolean"},"denyOverdue":{"type":"boolean"},"graceDays":{"type":"integer","minimum":0,"maximum":365}}}
    CenterAccessPolicyCommand: {"type":"object","additionalProperties":false,"required":["centerId","version","policy","requestId"],"properties":{"centerId":{"type":"string"},"version":{"type":"integer","minimum":0},"policy":{"$ref":"#/components/schemas/CenterAccessPolicy"},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessDeviceCreate: {"type":"object","additionalProperties":false,"required":["centerId","name","requestId"],"properties":{"centerId":{"type":"string"},"name":{"type":"string","minLength":1,"maxLength":80},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessDeviceChange: {"type":"object","additionalProperties":false,"required":["centerId","id","version","requestId"],"properties":{"centerId":{"type":"string"},"id":{"type":"string"},"version":{"type":"integer","minimum":1},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessHoldCreate: {"type":"object","additionalProperties":false,"required":["centerId","memberId","memberVersion","reason","requestId"],"properties":{"centerId":{"type":"string"},"memberId":{"type":"string"},"memberVersion":{"type":"integer","minimum":1},"reason":{"type":"string","minLength":1,"maxLength":250},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessHoldRelease: {"type":"object","additionalProperties":false,"required":["centerId","memberId","id","version","requestId"],"properties":{"centerId":{"type":"string"},"memberId":{"type":"string"},"id":{"type":"string"},"version":{"type":"integer","minimum":1},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessOwnToken: {"type":"object","additionalProperties":false,"required":["centerId","requestId"],"properties":{"centerId":{"type":"string"},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterAccessScan: {"type":"object","additionalProperties":false,"required":["centerId","deviceId","token","requestId"],"properties":{"centerId":{"type":"string"},"deviceId":{"type":"string"},"token":{"type":"string","pattern":"^gqr1_[A-Za-z0-9_-]{43}$"},"requestId":{"type":"string","minLength":8,"maxLength":128}}}
    CenterTrainingBundle:
