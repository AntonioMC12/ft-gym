        '400': { description: Unexpected member/account identifiers or query options. }
        '401': { description: No current session. }
        '403': { description: Accessible staff center but no own membership capability. }
        '404': { description: Module off or no linked own affiliation. }
        '409': { description: Unsupported debt policy. }
