      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        taxId: { type: [string, 'null'], maxLength: 40 }
        address: { type: [string, 'null'], maxLength: 250 }
        contactEmail: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 40 }
        timezone: { type: string, default: Europe/Madrid, description: Valid IANA timezone. }
        capacity: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        billingDay: { type: integer, minimum: 1, maximum: 31 }
        openingHours:
          type: object
          description: 'Keys 0..6; at most four sorted nonoverlapping [HH:mm, HH:mm] intervals per day; end 24:00 allowed.'
          additionalProperties: { type: array, maxItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: string } } }
