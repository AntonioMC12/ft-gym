  /api/centers/training/propose:
    post:
      tags: [centers]
      operationId: proposeCenterTraining
      summary: Offer a bounded catalogue plan to an active linked member
      description: Requires training.assign and active center/member. Revalidates memberVersion under center lock. Creates immutable version, random delivery key and stable personal routine IDs. Does not write recipient JSON. No custom exercises or media in this first contract. Errors include invalid-training-plan, training-account-required, training-member-inactive, version-conflict and idempotency-conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, memberId, memberVersion, bundle, requestId]
              properties:
                centerId: { type: string }
                memberId: { type: string }
                memberVersion: { type: integer, minimum: 1 }
                bundle: { $ref: '#/components/schemas/CenterTrainingBundle' }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Proposal and first immutable version. Same idempotent command retains its fixed map. }
        '400': { description: Invalid bounded plan or input. }
        '403': { description: Missing training.assign. }
        '404': { description: Center/member unavailable. }
        '409': { description: Stale version, inactive affiliation, missing linked account or idempotency conflict. }
  /api/centers/training/revise:
    post:
      tags: [centers]
      operationId: reviseCenterTraining
      summary: Offer another immutable revision without overwriting personal routines
      description: Requires active center/member, original recipient link, training.assign and current proposal version. Supersedes the previous offer. Existing acceptance can still recover; a superseded unaccepted version cannot start acceptance. New revision has a new stable map and requires a new explicit personal decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, version, bundle, requestId]
              properties:
                centerId: { type: string }
                id: { type: string }
                version: { type: integer, minimum: 1 }
                bundle: { $ref: '#/components/schemas/CenterTrainingBundle' }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: New immutable proposal revision. }
        '400': { description: Invalid plan/input. }
        '403': { description: Missing training.assign. }
        '404': { description: Proposal/recipient unavailable. }
        '409': { description: version-conflict, training-proposal-unavailable or idempotency-conflict. }
