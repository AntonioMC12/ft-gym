  /api/centers/billing/debts/export:
    get:
      tags: [centers]
      operationId: exportCenterDebtCsv
      summary: Export an authorized center debt snapshot as human-facing CSV
      description: >-
        Requires explicitly granted data.export for the manager or configured platform allowlist.
        Exports outstanding receipts only, at most 5000; export-too-large refuses the entire export,
        never silently truncates. Optional paired due-date filters are inclusive and <=366 days.
        UTF-8 BOM, CRLF, quoted/escaped fields and a visible [text] prefix for dangerous formula,
        full-width and control prefixes. CSV is for human review, not a lossless administrative import.
        JSON response uses the normal authenticated mobile/browser transport; UI downloads content
        only after validating current center/account context. Audit contains count/filters, not names.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Audited complete snapshot for the chosen filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName: { type: string }
                  content: { type: string }
                  rowCount: { type: integer, maximum: 5000 }
                  today: { type: string, format: date }
                  currency: { type: string, const: EUR }
        '400': { description: Invalid filters or supplied export cursor. }
        '401': { description: No current session. }
        '403': { description: No current explicit export permission. }
        '404': { description: Module off or inaccessible center. }
        '409': { description: export-too-large, inactive center or unsupported debt policy. }
        '503': { description: Centers unavailable. }
  /api/centers/payments/record:
    post:
      tags: [centers]
      operationId: recordCenterPayment
      summary: Record a manually received payment and its receipt allocations atomically
      description: >-
        Requires payments.record in an active center or explicit platform allowlist. This records
        a historical movement; it does not transfer funds or call a payment provider. Positive
        canonical integer cents, EUR and a non-future civil date are required. Each of 1-50 unique
        receipts belongs to the same center/member; allocations must exactly sum to the payment
        and cannot exceed outstanding balances. Receipt order is canonical for idempotency.
        Payment, allocations, business audit and actor/operation/requestId result commit together.
        Concurrent overpayment is rejected; retries respect currently valid permissions.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPaymentInput' }
      responses:
        '200':
          description: Committed immutable payment or original idempotent result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/CenterPayment' }
        '400': { description: Invalid amount/date/method or incomplete/duplicate allocations. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or member/receipt outside selected center. }
        '409': { description: payment-exceeds-balance, conflicting requestId or inactive center. }
        '503': { description: Centers unavailable. }
  /api/centers/payments/refund:
    post:
      tags: [centers]
      operationId: recordCenterRefund
      summary: Append a manual refund against one payment allocation
      description: >-
        Requires payments.refund explicitly granted by platform to the manager, or the configured
        platform allowlist. Never implied by manager or technical user.admin. Positive exact cents,
        date between payment date and center-local today, and a private reason are required.
        Total refunds cannot exceed the original allocation. Appends an immutable refund and audit
        transactionally with idempotency; the receipt's derived balance increases. No bank transfer,
        destructive payment edits, or change to personal training/authentication. Audit excludes reason.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualRefundInput' }
      responses:
        '200':
          description: Payment with refunds and restored receipt balance, or original idempotent result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/CenterPayment' }
                  balance: { $ref: '#/components/schemas/ReceiptSettlement' }
        '400': { description: Invalid amount, date or missing reason. }
        '401': { description: No current session. }
        '403': { description: No current explicit refund capability. }
        '404': { description: Module off or payment/allocation outside selected member/center. }
        '409': { description: refund-exceeds-payment, conflicting requestId or inactive center. }
        '503': { description: Centers unavailable. }
  /api/centers/payments:
    get:
      tags: [centers]
      operationId: listCenterPayments
      summary: Paginated manual payment ledger for one center member
      description: >-
        Requires billing.read or configured platform. Stable created_at/id keyset cursor bound to
        account, center and member. Exact allocation/refund totals derive from all immutable entries.
        At most the latest 100 refund details per payment are returned; refundsTruncated signals
        additional history. No payment data enters personal S, cache or backup exports.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: memberId, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Authorized center-scoped page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments: { type: array, items: { $ref: '#/components/schemas/CenterPayment' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: Invalid or cross-scope cursor. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or inaccessible center/member. }
        '409': { description: Inactive center for local staff. }
        '503': { description: Centers unavailable. }
  /api/platform/centers/role-capabilities:
    post:
      tags: [centers]
      operationId: updateCenterRoleCapability
      summary: Explicitly grant or revoke refund or debt-export permission for a manager
      description: >-
        Only CENTERS_SUPERADMIN_UIDS allowlist, independently of user.admin. Requires current
        assignment version and requestId; never permits trainer grants or self escalation by staff.
        Preserves other extra capabilities. Shared center lock coordinates revocation with mutations;
        assignment/center versions and business audit update atomically. Same requestId/content replays.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, assignmentId, version, requestId]
              oneOf:
                - { required: [allowRefund] }
                - { required: [allowExport] }
              properties:
                centerId: { type: string }
                assignmentId: { type: string }
                version: { type: integer, minimum: 1 }
                allowRefund: { type: boolean }
                allowExport: { type: boolean, description: Update data.export only; exactly one grant per command. }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Committed permission update or original result with new assignment version. }
        '400': { description: Invalid input. }
        '401': { description: No current session. }
        '403': { description: Not an explicitly configured platform account. }
        '404': { description: No current manager assignment in selected center. }
        '409': { description: Stale version or conflicting requestId. }
        '503': { description: Centers unavailable. }
  /api/centers/receipts/generate:
    post:
      tags: [centers]
      operationId: generateCenterReceipt
      summary: Generate one immutable membership receipt for a contract period
      description: >-
        Requires billing.manage or configured platform. No client money fields accepted. Selected
        center/member/contract and original calendar boundary validated; future period starts refused.
        Exact quote, member name/number and calculationVersion are snapshotted in SQL. Unique
        center/subscription/period/concept plus center lock prevents duplicates under concurrency.
        Identical requestId returns committed result; another requestId for the same receipt returns
        alreadyExists with the original snapshot. Different due date conflicts. No recalculation of
        issued history after a pause/plan change; adjustments belong to later ledger work.
        Zero charges return skipped/no-charge without creating a receipt. No payment is recorded,
        no paid flag and no electronic invoice or external transmission. The center interface
        previews the authoritative quote, confirms its digest and due date, and lists immutable snapshots.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, memberId, subscriptionId, periodStart, dueOn, requestId]
              properties:
                centerId: { type: string }
                memberId: { type: string }
                subscriptionId: { type: string }
                periodStart: { type: string, format: date }
                dueOn: { type: string, format: date, description: Explicit date at or after period start. }
                requestId: { type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$' }
                expectedQuoteHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: Optional server preview digest; mismatch refuses new issuance with quote-changed. Existing receipts always keep their snapshot. }
      responses:
        '200': { description: receipt and optional alreadyExists, or skipped true with reason no-charge. }
        '400': { description: Invalid date, future period or unexpected client money fields. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial management capability unavailable. }
        '404': { description: Contract inaccessible in selected member/center. }
        '409': { description: Policy incomplete, canceled contract, idempotency or existing due-date conflict. }
  /api/centers/receipts:
    get:
      tags: [centers]
      operationId: listCenterReceipts
      summary: Read immutable receipt snapshots for a selected member
      description: Requires billing.read or platform; no trainer/other-center financial access. Cursor bound to caller, member and center. Each immutable receipt includes settlement derived from all allocations and refunds; its paid/partial/unpaid state is never editable.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: memberId, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: receipts and nextCursor; all monetary fields decimal text in minor units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        snapshot: { type: object, description: Original ChargePreview plus memberName/memberNumber at issuance. }
                        settlement: { $ref: '#/components/schemas/ReceiptSettlement' }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: Invalid pagination or cursor from another context. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial read capability unavailable. }
        '404': { description: Member inaccessible in selected center. }
  /api/centers/billing/preview:
    post:
      tags: [centers]
      operationId: previewCenterCharge
      summary: Preview exact period charges from pinned SQL terms and membership dates
      description: >-
        Requires billing.read or platform. Client provides only selected center/member/contract and
        optional period boundary. Default period follows the contract calendar/timezone. Original
        billing-day anchor survives short months; monthly/quarterly/half-yearly/yearly phases are checked.
        UTC arithmetic counts civil dates independent of DST. Active days exclude freeze and ended
        dates, resolve latest same-day event and ignore canceled events. actual-days prorates by days;
        none charges a full period when at least one day is active, zero when none. Round nonnegative
        values half-up at proration, discount and tax steps. Included tax is split from discounted gross;
        excluded tax is added to discounted net. All minor-unit amounts are decimal strings.
        Tax and proration must be explicitly configured. Returns calculationVersion 1, no receipt/payment.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, memberId, id]
              properties:
                centerId: { type: string }
                memberId: { type: string }
                id: { type: string }
                periodStart: { type: string, format: date, description: Boundary matching original interval and billing-day anchor. }
      responses:
        '200':
          description: Balanced read-only charge preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: { $ref: '#/components/schemas/ChargePreview' }
                  quoteHash: { type: string, pattern: '^[a-f0-9]{64}$', description: Server digest for optional receipt confirmation guard. }
        '400': { description: Invalid calendar boundary or injected price/conditions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial read capability unavailable. }
        '404': { description: Contract inaccessible in selected member/center. }
        '409': { description: Canceled contract or billing-policy-required. }
  /api/centers/subscriptions:
    get:
      tags: [centers]
      operationId: listCenterSubscriptions
      summary: Read member contracts with pinned prices and effective dates
      description: Requires billing.read or platform. Selected member/center verified. Up to 100 contracts, prioritizing uncanceled rows before canceled history. Effective end includes membership termination; freeze state derives from dated membership history, independent of jobs. No billing issuance.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: memberId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Current member, today in center zone, membership changes and subscriptions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial read capability unavailable. }
        '404': { description: Member inaccessible in selected center. }
  /api/centers/subscriptions/create:
    post:
      tags: [centers]
      operationId: createCenterSubscription
      summary: Assign a current fee version and activate membership on its effective date
      description: >-
        Requires billing.manage or platform. Price version and member must belong to selected center;
        archived or stale catalog versions cannot start new contracts. Pins calendar, discount and
        immutable terms. Member version serializes changes; SQL exclusion also prevents overlapping
        uncanceled primary contracts. Preactive activation is recorded for effectiveOn, without
        changing personal account or training. Incomplete tax conditions cannot generate charges.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '200': { description: Authoritative member/history/subscriptions with updated member version. }
        '400': { description: Invalid date, discount, reason or unexpected field. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial management capability unavailable. }
        '404': { description: Member or price unavailable in selected center. }
        '409': { description: Version/overlap, pending transition, ended membership or catalog conflict. }
  /api/centers/subscriptions/change:
    post:
      tags: [centers]
      operationId: changeCenterSubscription
      summary: Change fee or discount with a new dated contract
      description: >-
        Closes the old range at effectiveOn and starts a new pinned contract atomically. Old price,
        discount and calendar stay immutable. No second future change while one is pending.
        A same-day replacement can leave an empty historical period; no deletion. requestId is idempotent.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SubscriptionInput' }
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, description: Current uncanceled contract ID within selected member. }
      responses:
        '200': { description: Updated authoritative member/history/subscriptions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial management capability unavailable. }
        '404': { description: Member, contract or price unavailable in selected center. }
        '409': { description: Stale version, pending contract, invalid range or catalog conflict. }
  /api/centers/subscriptions/cancel:
    post:
      tags: [centers]
      operationId: cancelScheduledCenterSubscription
      summary: Cancel a future contract and recover its previous range
      description: >-
        Only startsOn strictly after today in center zone. Keeps canceled history. Restores the
        replaced contract previous end, or cancels a future activation event for a first contract.
        Membership end/pause events remain dated history; accounts never disabled. Repeating the
        same requestId returns the committed result. Applied contracts cannot be erased or canceled here.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, memberId, memberVersion, id, requestId]
              properties:
                centerId: { type: string }
                memberId: { type: string }
                memberVersion: { type: integer, minimum: 1 }
                id: { type: string }
                requestId: { type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$' }
      responses:
        '200': { description: Updated member/history/contracts; canceled record retained. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Financial management capability unavailable. }
        '404': { description: Contract unavailable in selected member/center. }
        '409': { description: Stale member version, applied/canceled contract or idempotency conflict. }
  /api/centers/plans:
    get:
      tags: [centers]
      operationId: listMembershipPlans
      summary: List current membership fee plans in a selected center
      description: Requires plans.manage or configured platform superadmin. Current price versions only. Cursor bound to caller/center/filters. No trainer/member financial access.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: archived, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200': { description: plans and nextCursor; exact minor-unit prices as decimal strings. }
        '400': { description: Invalid filters or cursor. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '404': { description: Center inaccessible or module off. }
  /api/centers/plan:
    get:
      tags: [centers]
      operationId: getMembershipPlan
      summary: Read a membership fee plan and its immutable price history
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: plan and versions descending by revision; archived history retained. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current plans.manage unavailable. }
        '404': { description: Plan inaccessible in selected center. }
  /api/centers/plans/create:
    post:
      tags: [centers]
      operationId: createMembershipPlan
      summary: Create a fee plan and its first immutable price version
      description: Requires plans.manage or platform. requestId is idempotent. Incomplete tax/proration is allowed for catalog preparation but cannot produce definitive charges. Currency is currently EUR only.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipPlanCreate' }
      responses:
        '200': { description: Current plan with priceVersionId, revision and optimistic version. }
        '400': { description: Invalid decimal minor-unit text or conditions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '409': { description: Idempotency conflict or inactive center. }
  /api/centers/plans/revise:
    post:
      tags: [centers]
      operationId: reviseMembershipPlan
      summary: Append a new price and condition version
      description: Requires current plan version and requestId. Existing price rows are never modified; subscriptions retain their pinned version. Archived plans cannot be revised.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MembershipPlanCreate' }
                - type: object
                  required: [id, version]
                  properties:
                    id: { type: string }
                    version: { type: integer, minimum: 1 }
      responses:
        '200': { description: New immutable price version and current plan. }
        '400': { description: Invalid conditions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '404': { description: Plan unavailable in selected center. }
        '409': { description: Stale version, archived plan, inactive center or idempotency conflict. }
  /api/centers/plans/duplicate:
    post:
      tags: [centers]
      operationId: duplicateMembershipPlan
      summary: Copy a selected historical version into a new fee plan
      description: Pins source priceVersionId; concurrent price changes never alter what is duplicated. Archived plans can be copied; original remains archived. Only the new name is editable.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, priceVersionId, name, requestId]
              properties:
                centerId: { type: string }
                id: { type: string }
                priceVersionId: { type: string }
                name: { type: string, minLength: 1, maxLength: 120 }
                requestId: { type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$' }
      responses:
        '200': { description: New active plan with copied conditions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '404': { description: Source plan/version unavailable in selected center. }
        '409': { description: Idempotency conflict or inactive center. }
  /api/centers/plans/archive:
    post:
      tags: [centers]
      operationId: archiveMembershipPlan
      summary: Archive a fee plan without deleting prices or existing contracts
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, version]
              properties:
                centerId: { type: string }
                id: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Archived current plan. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '404': { description: Plan unavailable in selected center. }
        '409': { description: Stale version or already archived. }
  /api/centers/invitations:
    get:
      tags: [centers]
      operationId: listCenterInvitations
      summary: List recipient-bound invitation metadata
      description: Center manager can list member/trainer invitations; platform can also list managers. Last 50, no secret or hash. Selected center and current capability are checked.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [member, trainer, manager], default: member } }
        - { name: memberId, in: query, schema: { type: string } }
      responses:
        '200': { description: Invitation metadata with status and server-computed expired flag. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Current capability unavailable. }
        '503': { description: Centers database unavailable. }
  /api/centers/invitations/create:
    post:
      tags: [centers]
      operationId: createCenterInvitation
      summary: Invite an existing enabled account to a center
      description: >-
        Manager invites members/trainers; only configured platform superadmin invites managers.
        Contact email never proves ownership. Recipient must create a personal account first,
        subject to existing registration policy. Member and center must match and be unlinked.
        Server creates a 256-bit secret, stores only SHA-256 and metadata, and returns the token once.
        An identical requestId replay returns the metadata with token null. Lost links must be revoked
        and replaced. Deliver the hash-route link through a controlled channel; no automatic email.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CenterInvitationInput' }
      responses:
        '200':
          description: Metadata and one-time secret; null secret on replay.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: '#/components/schemas/CenterInvitation' }
                  token: { type: [string, 'null'], pattern: '^[a-zA-Z0-9_-]{43}$' }
        '400': { description: Invalid input. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Capability unavailable or manager role escalation attempted. }
        '404': { description: Recipient or selected member unavailable. }
        '409': { description: Pending invitation exists, account already linked, or idempotency conflict. }
  /api/centers/invitations/revoke:
    post:
      tags: [centers]
      operationId: revokeCenterInvitation
      summary: Revoke a pending invitation with optimistic version check
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, version]
              properties:
                centerId: { type: string }
                id: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Revoked metadata. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Capability unavailable; manager invitation requires platform. }
        '404': { description: Invitation unavailable in selected center. }
        '409': { description: Version conflict or invitation already accepted/revoked. }
  /api/centers/invitations/inspect:
    post:
      tags: [centers]
      operationId: inspectCenterInvitation
      summary: Preview an invitation as its authenticated recipient
      description: Checks recipient, expiration and issuer current authority. Returns only selected invitation metadata and center name; never grants access. Wrong account has the same 404 as unknown token.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CenterInvitationToken' }
      responses:
        '200': { description: Selected invitation metadata and centerName. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Invitation or recipient/issuer unavailable. }
        '410': { description: Invitation expired. }
  /api/centers/invitations/accept:
    post:
      tags: [centers]
      operationId: acceptCenterInvitation
      summary: Explicitly accept a recipient-bound invitation
      description: >-
        Rechecks current issuer authority, account availability, center, expiration and row locks.
        Linking the member or assigning staff and marking accepted commit atomically in SQL.
        JSON account/training and global admin remain unchanged. Retry of an accepted token returns
        alreadyAccepted without regranting a revoked role. A manager can activate a draft center.
      security: [{ session: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CenterInvitationToken' }
      responses:
        '200': { description: accepted, centerId, kind and optional alreadyAccepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Invitation unavailable for caller. }
        '409': { description: Recipient lock busy, member already linked or center inactive. }
        '410': { description: Invitation expired; no partial link or role assignment. }
  /api/centers/members/transition:
    post:
      tags: [centers]
      operationId: transitionCenterMember
      summary: Schedule or apply termination, freeze or resumption
      description: |
        Requires members.manage, including explicit superadmin access. Uses center-local
        dates, optimistic member version and persisted requestId idempotency. Termination
        accepts preactive/active/frozen; freeze requires active; resumption requires frozen.
        Future effects remain scheduled until their date, even without a running job.
        A freeze may include automatic resumption. Manual early resumption or termination
        can replace an outstanding automatic resumption; conflicting pending changes return 409.
        Personal account, training and billing are not changed by this workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipTransitionInput' }
      responses:
        '200':
          description: Committed change or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipChangeResult' }
        '400': { description: Invalid input, impossible dates, retroactivity or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or member outside selected center. }
        '409': { description: 'Conflict; version-conflict, idempotency-conflict, invalid-transition, pending-transition or center-inactive.' }
        '503': { description: Centers unavailable. }
  /api/centers/members/transition/cancel:
    post:
      tags: [centers]
      operationId: cancelCenterMemberTransition
      summary: Cancel an unapplied scheduled membership change
      description: |
        Requires members.manage or explicit superadmin. Only a future root change can be
        canceled; applied changes and automatic child events cannot be canceled directly.
        Cancels the root and its future children atomically. Restores a future automatic
        resumption that the canceled change had superseded, preserving immutable history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, version, changeId, requestId]
              properties:
                centerId: { type: string }
                id: { type: string }
                version: { type: integer, minimum: 1 }
                changeId: { type: string }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Committed cancellation or original idempotent response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipChangeResult' }
        '400': { description: Invalid input or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or change outside selected member/center. }
        '409': { description: Change applied, canceled, automatic, stale version or conflicting requestId. }
        '503': { description: Centers unavailable. }
  /api/centers/members:
    get:
      tags: [centers]
      operationId: listCenterMembers
      summary: Paginated member list within the selected center
      description: |
        Requires members.read or members.operational.read. Trainers receive only operational
        fields; managers also receive contact and document fields. Literal name/number search,
        stable created_at/id keyset order. Cursor is bound to account, center and filters.
        Explicit superadmin accounts can administer members in every selected center;
        this global access is audited. Technical admin alone does not grant member access.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: state, in: query, schema: { type: string, enum: [preactive, active, frozen, ended] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2000 } }
      responses:
        '200':
          description: Role-filtered page and next cursor, null at the end.
          content:
            application/json:
              schema:
                type: object
                required: [members, nextCursor]
                properties:
                  members: { type: array, items: { type: object } }
                  nextCursor: { type: [string, 'null'] }
        '400': { description: Invalid filter or cursor, including reuse in another account or center. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability within accessible center. }
        '404': { description: Module off or center not accessible. }
        '409': { description: Center inactive. }
        '503': { description: Centers unavailable. }
  /api/centers/members/create:
    post:
      tags: [centers]
      operationId: createCenterMember
      summary: Create a preactive member without a linked account
      description: |
        Requires members.manage in an active center. Allocates a member number under the
        shared center lock, audits without private fields and persists the idempotent result.
        Equal actor/requestId/content replay the original response; changed content conflicts.
        Email/document uniqueness is local to the center. No account is linked or activated;
        joinedOn uses the center time zone. State changes belong to a separate workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MemberContactFields' }
                - type: object
                  required: [centerId, requestId]
                  properties:
                    centerId: { type: string }
                    requestId: { type: string, minLength: 8, maxLength: 128 }
              unevaluatedProperties: false
      responses:
        '200': { description: Created member projection, including number, preactive state and version. }
        '400': { description: Invalid input or unexpected account/state/privilege field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or center not accessible. }
        '409': { description: Duplicate local contact/document, idempotency conflict or inactive center. }
        '503': { description: Centers unavailable. }
  /api/centers/members/update:
    post:
      tags: [centers]
      operationId: updateCenterMember
      summary: Update member contact fields with optimistic version
      description: Full contact snapshot; omitted optional fields clear them. Does not change membership state, dates, account links or training.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MemberContactFields' }
                - type: object
                  required: [centerId, id, version]
                  properties:
                    centerId: { type: string }
                    id: { type: string }
                    version: { type: integer, minimum: 1 }
              unevaluatedProperties: false
      responses:
        '200': { description: Updated role-filtered member with incremented version. }
        '400': { description: Invalid input or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or member outside accessible center. }
        '409': { description: Version conflict, local duplicate or inactive center. }
        '503': { description: Centers unavailable. }
  /api/centers/detail:
    get:
      tags: [centers]
      operationId: getCenterDetail
      summary: Center configuration filtered by role
      description: Requires center.read; full metadata for platform or manager, operational data only for trainer. Inactive centers are readable.
      parameters:
        - name: centerId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Authorized projection or committed audited change. }
        '400': { description: Invalid input or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or resource not accessible. }
        '409': { description: 'Conflict; version-conflict, duplicate, last-manager, account-inactive, center-inactive, idempotency-conflict or invalid-state.' }
        '503': { description: Centers unavailable. }
  /api/centers/staff:
    get:
      tags: [centers]
      operationId: getCenterStaff
      summary: Staff assignments and revoked history
      description: Requires staff.manage or explicit platform allowlist.
      parameters:
        - name: centerId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Authorized projection or committed audited change. }
        '400': { description: Invalid input or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or resource not accessible. }
        '409': { description: 'Conflict; version-conflict, duplicate, last-manager, account-inactive, center-inactive, idempotency-conflict or invalid-state.' }
        '503': { description: Centers unavailable. }
  /api/platform/centers:
    get:
      tags: [centers]
      operationId: getPlatformCenters
      summary: List centers
      description: Explicit platform allowlist only; cursor pages ordered by creation/id descending. Literal name or center-ID search. Cursor is bound to account and query; no fixed total100 cap. Current session is checked again before returning.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200': { description: Authorized projection or committed audited change. }
        '400': { description: Invalid input or unexpected field. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: Module off or resource not accessible. }
