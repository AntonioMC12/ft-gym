# openGym HTTP API: hand-written OpenAPI 3.1 spec.
# Source of truth: api/server.js (a single framework-free Node file). Every route the
# server registers is documented here; if you add a route there, add it here too.
# Browsable version: https://opengym.ch/api.html
openapi: 3.1.0

info:
  title: openGym API
  version: 1.4.1
  summary: Passkey (WebAuthn) auth + per-user state storage for openGym
  description: |
    The backend of [openGym](https://opengym.ch), a free, open-source
    gym & body-weight tracker. A plain Node server, no framework, JSON-file storage,
    HMAC-signed session cookies.

    ### Authentication
    Sign-in is by **passkey** (WebAuthn, via `@simplewebauthn/server`). A successful
    `register/verify` or `login/verify` sets the session cookie; every authenticated
    route then works with that cookie. The paired mobile app has no shared cookie jar,
    so it redeems a short pairing code (`/api/pair/redeem`) for the *same* signed token
    and sends it as `Authorization: Bearer <token>` instead.

    An instance started with `PASSWORD_LOGIN=1` also offers **name-and-password
    sign-in** (tag `password`): opt-in per profile, scrypt-hashed, throttled, with an
    admin-issued one-time reset code instead of e-mail. A profile may also add an e-mail
    address to sign in with instead of its name (`/api/account/email`); no mail is ever
    sent to it. Its routes set exactly the same cookie. With the flag off (the default)
    every one of them answers 404.

    ### Throttling
    The `password` routes are counted per client address: at most 60 requests a minute
    across them, and wrong answers (a password, a reset code, an invite code on password
    signup, an e-mail address already in use) pause the address from the 21st on, for 30 s,
    doubling up to 15 min. Wrong passwords also pause the *account* they were tried
    against from the 6th on, for 1 min doubling up to 1 h (the same pause whether the account
    was named by its name or its e-mail), and an identifier that names no account is
    paused the same way, as typed. A password check counts from the moment it
    starts, so checks sent at once get no more tries than checks sent one by one. A
    paused caller gets `429 {"error": …, "code": "locked", "retryAfter": <s>}` with a
    `Retry-After` header. Passkey sign-up and sign-in and the pairing routes are not
    throttled (their failures reach the audit log at most ten a minute per address).
    The two routes that redeem a one-time device link (tag `passkeys`) share
    the per-address budget, and wrong codes pause the address for link redemption only,
    from the 21st on, the way wrong reset codes do. Adding or removing a passkey in Settings
    (`POST /api/account/passkeys/options`, `DELETE /api/account/passkeys`) and making a
    device code (`POST /api/account/device-link`) spend the per-address budget too, and a
    current password given there as proof counts like one given at sign-in.
    The address is the socket's, or with `TRUST_PROXY=1` the one a trusted proxy put in
    `CF-Connecting-IP` / the last `X-Forwarded-For` entry / `X-Real-IP`; IPv6 clients are
    counted by /64. Counters live in memory and reset on restart.

    ### Sessions
    The cookie/bearer value is `<payload>.<hmac>` where the payload is
    `<uid>:<expiry-ms>:<session-version>`, signed with a per-instance secret
    (HMAC-SHA256). Sessions last `SESSION_DAYS` (default 90). `POST /api/logout/all`
    bumps the user's session version, which invalidates every token ever issued for
    the account.

    ### CSRF
    State-changing browser requests must come from the app's own origin. The server
    checks `Sec-Fetch-Site` (falling back to `Origin` vs the configured `ORIGIN`);
    a mismatch is refused with `403 {"error":"cross-origin request refused"}` on any
    non-GET route. Exempt: passkey sign-up and sign-in (`register/options`,
    `register/verify`, `login/options`, `login/verify`) and `pair/redeem`, each of which
    carries its own one-shot credential in the body, and any request authenticated with a
    Bearer token.
    The password routes are **not** exempt: a hostile page knows a valid name and
    password of its own, and could otherwise sign a visitor into it (login CSRF).
    Neither are the device-link routes: a link is redeemed on the app's own origin,
    the only one a passkey can be created for.

    ### Environment-dependent behavior
    - `INVITE_ONLY=1`: registration requires a valid invite code (minted by an admin).
    - `ALLOW_GUEST=0`: hides the client-side "continue without account" mode; the
      server merely reports the flag via `GET /api/config` (guest mode never talks to
      this API at all).
    - `ADMIN_UIDS=<uid>,<uid>`: user ids treated as admins (a `"admin": true` flag on
      the user record in `db.json` works too). Admins get the `/api/admin/*` routes.
    - `FIRST_USER_ADMIN` (default off; `1` turns it on): the first profile registered
      on an instance with no profiles gets that `"admin": true` flag. Decided at
      registration only, never applied to an instance that already has profiles.
    - `AUDIT_LOG` (default on), `AUDIT_MAX` (default 5000 events), `AUDIT_DAYS`
      (default 90), `AUDIT_IP` (`off` | `net` | `full`, default off) shape the audit
      log served by `GET /api/admin/audit`.
    - `PASSWORD_LOGIN=1`: adds the `password` routes and `password_login: true` in
      `GET /api/config`. Off by default.
    - `DEFAULT_LANG` (e.g. `pt-BR`; unset by default): `default_lang` in `GET /api/config`,
      the language of the sign-in screen and of every profile that never picked one.
    - `TRUST_PROXY=1`: the throttle reads the client address from proxy headers (set by
      the bundled `docker-compose.yml`, where only the web container can reach the API).
    - `MEDIA_UPLOADS` (default on; `0` removes the `media` routes and the `media` block of
      `GET /api/config`), `MEDIA_QUOTA_MB` (200 per profile, `0` = no cap),
      `MEDIA_IMAGE_MAX_MB` (2), `MEDIA_GIF_MAX_MB` (8), `MEDIA_VIDEO_MAX_MB` (40),
      `MEDIA_VIDEO_MAX_SEC` (60), `MEDIA_GC_GRACE_DAYS` (14), `MEDIA_UPLOADS_PER_HOUR` (600
      per profile), `MEDIA_MIN_FREE_MB` (512, `0` = no floor): photos and videos of custom
      exercises (tag `media`). Every MB here is 2^20 bytes.

    ### Conventions
    - Every response body is JSON with `Cache-Control: no-store`. The one exception is
      `GET /api/media/{hash}`, which answers with the stored file itself
      (`Cache-Control: private, no-store`).
    - Errors are always `{"error": "<human-readable message>"}`. The `password`, throttle and
      `media` routes add a stable `code` for the client to word in its own language.
    - Unknown method+path pairs return `404 {"error":"not found"}`; an unhandled
      exception returns `500 {"error":"server error"}`.
    - Request bodies are parsed as JSON regardless of Content-Type. A body that does
      not parse, or parses to anything but an object (`null`, a string, an array), is
      `400 {"error":"invalid json"}` on every route that reads one; an empty body counts
      as `{}`. A body over 5 MiB is `413 {"error":"body too large"}`; the rest of the
      upload is discarded so the answer reaches the client.
    - CORS: the request's `Origin` is reflected in `Access-Control-Allow-Origin`
      **without** `Allow-Credentials`, so cross-origin callers can only ever
      authenticate with a Bearer token, never with the cookie.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: openGym
    url: https://gitlab.com/DuarteSantos8/opengym

servers:
  - url: /
    description: Same origin as the openGym web app (the normal deployment)
  - url: https://opengym.example.com
    description: Your self-hosted instance

tags:
  - name: centers
    description: Opt-in centers module. Tenant-scoped center administration with separate platform authorization.
  - name: meta
    description: Health and public configuration
  - name: auth
    description: Passkey (WebAuthn) registration and login, sessions
  - name: pairing
    description: Mobile-app pairing (code from a signed-in browser tab)
  - name: password
    description: >-
      Optional name-and-password sign-in (`PASSWORD_LOGIN=1`). Every route here is a 404
      while the flag is off.
  - name: passkeys
    description: >-
      More than one passkey on a profile: list, add, rename, remove, plus one-time device
      links, which let another device of the same person add a passkey of its own.
  - name: data
    description: Per-user state sync (the whole app state as one JSON blob)
  - name: push
    description: Web Push (VAPID) subscriptions, rest-timer and test pushes
  - name: activity
    description: Live-workout presence heartbeat
  - name: admin
    description: Admin dashboard. Requires an admin session (`ADMIN_UIDS` or `admin:true`)
  - name: media
    description: >-
      The photo, GIF or video of a user's own custom exercise, and the photos and videos
      attached to a logged workout. Stored per profile (one quota for both) and named
      by the SHA-256 of its bytes; the state only carries a `MediaRef`. Every route here is a
      404 when the instance runs with `MEDIA_UPLOADS=0`.
  - name: coach
    description: >-
      AI Coach: plans, reviews and debriefs. Every route here answers 503 unless the
      instance has the Coach switched on and a provider connected.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/centers/freezes:
    get:
      tags: [centers]
      operationId: listCenterFreezeRequests
      summary: Read freeze policy and a member's paginated freeze requests
      description: Current members.manage or explicit platform allowlist; selected center and member required. Returns 30 requests, newest first, with a scoped nextCursor. Inactive history stays readable.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: memberId, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: 'policy {config,version}, requests and nextCursor; no configured policy means enabled false and version zero.' }
        '400': { description: Unexpected selector or invalid scoped cursor. }
        '403': { description: Management capability required. }
        '404': { description: Center or member unavailable. }
  /api/centers/own/freezes:
    get:
      tags: [centers]
      operationId: listOwnCenterFreezeRequests
      summary: Read only the signed-in member's own requests and current policy
      description: Same 30-row cursor contract as the administrative list. Derives member from session; memberId/account selectors are rejected, including for managers who are also members.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Current policy and actor-owned requests only. }
        '400': { description: Invalid selectors or cursor. }
        '404': { description: Own membership unavailable. }
  /api/centers/freezes/policy:
    post:
      tags: [centers]
      operationId: configureCenterFreezePolicy
      summary: Explicitly configure optional self-service freezing
      description: Current members.manage or explicit platform allowlist, active center, optimistic policy version and idempotent requestId. Disabled by default. All limits must be supplied; minimum/maximum/annual days 1..366, notice 0..366, minimum <= maximum <= annual. billingEffect must be contract-proration; the existing pinned contract's proration governs future calculation. No changes to receipts or debt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, config, version, requestId]
              properties:
                centerId: { type: string }
                version: { type: integer, minimum: 0 }
                requestId: { type: string, minLength: 8, maxLength: 128 }
                config:
                  type: object
                  additionalProperties: false
                  required: [enabled, minDays, maxDays, noticeDays, maxDaysPerYear, billingEffect]
                  properties:
                    enabled: { type: boolean }
                    minDays: { type: integer, minimum: 1, maximum: 366 }
                    maxDays: { type: integer, minimum: 1, maximum: 366 }
                    noticeDays: { type: integer, minimum: 0, maximum: 366 }
                    maxDaysPerYear: { type: integer, minimum: 1, maximum: 366 }
                    billingEffect: { type: string, const: contract-proration }
      responses:
        '200': { description: Saved policy and version. }
        '400': { description: Missing or invalid explicit limits. }
        '403': { description: Management capability required. }
        '409': { description: Version conflict, idempotency conflict or inactive center. }
  /api/centers/own/freezes/request:
    post:
      tags: [centers]
      operationId: requestOwnCenterFreeze
      summary: Request a bounded freeze without changing membership or billing
      description: Derives member from session. Active member and center, enabled policy, exclusive resumption date, pre-notice and annual day limits required. Annual allowance includes actual administrative frozen days and scheduled changes. One pending request per member. Stable requestId returns the durable request; changed content conflicts. No request can directly approve itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, effectiveOn, resumeOn, reason, requestId]
              properties:
                centerId: { type: string }
                effectiveOn: { type: string, format: date }
                resumeOn: { type: string, format: date }
                reason: { type: string, minLength: 1, maxLength: 250 }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Actor-owned pending request; no lifecycle or financial mutation. }
        '400': { description: Unexpected fields or invalid dates. }
        '404': { description: Own membership unavailable. }
        '409': { description: freeze-disabled, freeze-limits, freeze-pending, pending-transition, invalid-transition or idempotency-conflict. }
  /api/centers/own/freezes/withdraw:
    post:
      tags: [centers]
      operationId: withdrawOwnCenterFreeze
      summary: Withdraw one's own pending request, including in an inactive center
      description: Requires centerId, id, version, action withdrawn and requestId; optional reason. Own actor and current own membership are checked before replay. Terminal requests cannot change again.
      responses:
        '200': { description: Durable withdrawn request. }
        '400': { description: Invalid decision fields. }
        '404': { description: Own request unavailable. }
        '409': { description: Version, terminal state or idempotency conflict. }
  /api/centers/freezes/decide:
    post:
      tags: [centers]
      operationId: decideCenterFreeze
      summary: Approve or reject a pending request with current authority
      description: Requires centerId, id, version, action approved/rejected and requestId. Rejection requires reason. Approval also requires current memberVersion, unchanged policy version, same linked owner, valid dates/annual budget, active center/member and no conflicting scheduled change. Uses the existing lifecycle transaction to create freeze plus automatic resume once, then saves decision/audit atomically. Existing receipts/debt are unchanged. Rejection remains allowed in an inactive center. Cookie CSRF rules apply to all mutations.
      responses:
        '200': { description: Durable request and lifecycle result on approval; concurrent identical retries return the same result. }
        '400': { description: Invalid decision fields. }
        '403': { description: Management capability required. }
        '404': { description: Request or selected center unavailable. }
        '409': { description: Version/idempotency conflict, freeze-policy-changed, freeze-owner-changed, freeze-limits, freeze-decided, pending-transition or inactive center. }
  /api/centers/members/imports/prepare:
    post:
      tags: [centers]
      operationId: prepareCenterMemberCsvImport
      summary: Prepare an actor-owned member CSV review without creating members
      x-retention: Expired reviews return no private rows. Optional bounded maintenance clears records and preserves expired replay metadata; completed results remain unchanged. Earlier backups need a separate retention policy.
      description: Current members.manage in an active selected center or explicit platform allowlist. UTF-8 CSV up to256KiB and200records, comma/semicolon with RFC4180 quoting, known name/email/phone/nationalDocument headers or documented Spanish aliases. Unknown identity/role/financial columns rejected. Explicit duplicatePolicy skip, matched using existing SQL email/document normalization. Names alone never establish identity. Invalid rows prevent completion. No accounts, roles, balances, contracts or payments created. A durable bounded job expires after24hours. Same actor/center/requestId replays; changed content conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, csv, duplicatePolicy, requestId]
              properties:
                centerId: { type: string }
                csv: { type: string }
                duplicatePolicy: { type: string, const: skip }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: id/state/definitionVersion/expiresAt/reviewHash/summary/rows with physical line numbers and ready/skipped/error statuses. No members created. }
        '400': { description: invalid-member-csv or invalid-input; malformed headers/quoting/limits/selectors. }
        '403': { description: Current management capability required. }
        '404': { description: Center unavailable. }
        '409': { description: idempotency-conflict or center-inactive. }
  /api/centers/members/imports/detail:
    get:
      tags: [centers]
      operationId: getCenterMemberCsvImport
      summary: Recover an owned import review or its durable completion result
      description: Same actor and selected center, current members.manage or platform allowlist; no other staff member inherits the review. A prepared review recomputes current duplicates and reviewHash; expired jobs cannot complete. Completed jobs return member IDs/statuses without retaining the original private row fields. No CSV or administrative records enter personal state.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Prepared or expired review, or completed result. }
        '400': { description: Unexpected selector. }
        '403': { description: Management capability missing. }
        '404': { description: Import unavailable to this actor/center. }
  /api/centers/members/imports/commit:
    post:
      tags: [centers]
      operationId: commitCenterMemberCsvImport
      summary: Confirm a reviewed bounded member import atomically and idempotently
      description: Under the shared center lock, rechecks current authority, expiry and reviewHash. Any invalid row blocks the entire commit. New duplicate changes require a new review, never silently change the confirmed batch. All eligible preactive member rows, sequential numbers, audit and durable completion commit in one transaction; repeated identical confirmation returns the saved result. Completed jobs cannot run twice. No accounts, memberships/contracts, balances or charges are imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, id, reviewHash]
              properties:
                centerId: { type: string }
                id: { type: string }
                reviewHash: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200': { description: Durable completed result with imported/skipped counts and per-record member IDs/statuses. }
        '400': { description: Invalid or unexpected command fields. }
        '403': { description: Current members.manage required. }
        '404': { description: Owned import unavailable. }
        '409': { description: 'import-review-changed, import-expired, import-invalid-rows, idempotency-conflict or center-inactive.' }
  /api/centers/metrics:
    get:
      tags: [centers]
      operationId: getCenterContractFinancialMetrics
      summary: Read exact contractual and registered financial metrics for one center
      description: Requires current billing.read or explicit platform allowlist; inactive-center history is readable. One SQL snapshot and captured instant, center-local business dates, definitionVersion1 and EUR. Counts/money are integer strings. Current outstanding/overdue stock is separate from selected-period flows. Unsupported debt policy with a positive balance makes overdueMinor null and overduePolicyComplete false. Does not return member identities, training, visits or inferred occupancy. Default period is local month start through today.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Exact aggregates. Net collections may be negative when refunding an earlier period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CenterMetrics' }
        '400': { description: invalid-metrics-period or unknown selector. Both bounds together, no future period, at most366inclusive days. }
        '403': { description: Missing billing.read. }
        '404': { description: Center unavailable to current session. }
        '503': { description: Centers temporarily unavailable. }
  /api/platform/centers/metrics:
    get:
      tags: [centers]
      operationId: getGlobalContractFinancialMetrics
      summary: Read global contractual and registered financial aggregates
      description: Explicit platform allowlist only; user.admin and center management never imply global metrics. One SQL statement uses one snapshot across all centers without a list cap; the same statement audits the read for each included center. Local-calendar dates are evaluated per center, with future local days excluded. Default period is month start through the latest current local day. Only aggregate counts and exact EUR strings leave SQL; no center/member/account list, personal state, visits or occupancy. A policy gap makes the overdue total unknown rather than silently zero.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Same aggregate contract, scoped to every center under the authorized platform transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CenterMetrics' }
        '400': { description: Invalid bounded period or forbidden center/member/account/clock selector. }
        '403': { description: Explicit platform identity required. }
        '503': { description: Centers temporarily unavailable. }
  /api/centers/access:
    get:
      tags: [centers]
      operationId: getCenterAccess
      summary: Read explicit access policy and a bounded reception-device page
      description: "Requires current access.manage or explicit platform allowlist. Policy defaults disabled. Response contains policy/version, devices and nextCursor. Device hashes and credentials are never listed."
      parameters:
        - {"name":"centerId","in":"query","required":true,"schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer"}}
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
        '503': { description: Centers or private credential source unavailable. }
  /api/centers/access/member:
    get:
      tags: [centers]
      operationId: getCenterMemberAccess
      summary: Read operational access status and the active manual hold
      description: "Requires access.manage. Explicit current member in selected center. Response contains operational identity/version, allowed boolean and current manual hold; never the personal training file."
      parameters:
        - {"name":"centerId","in":"query","required":true,"schema":{"type":"string"}}
        - {"name":"memberId","in":"query","required":true,"schema":{"type":"string"}}
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
        '503': { description: Centers or private credential source unavailable. }
  /api/centers/access/visits:
    get:
      tags: [centers]
      operationId: listCenterAccessVisits
      summary: List verified admissions recorded by reception
      description: "Requires access.verify. Cursor is bound to operator, selected center and member filter. Contains visitId, memberId, deviceId, operatorUid and visitedAt. Presence/activity data is not a visit."
      parameters:
        - {"name":"centerId","in":"query","required":true,"schema":{"type":"string"}}
        - {"name":"memberId","in":"query","schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer"}}
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
        '503': { description: Centers or private credential source unavailable. }
  /api/centers/own/access:
    get:
      tags: [centers]
      operationId: getOwnCenterAccess
      summary: Read own current access eligibility
      description: "Session member and current link are resolved by the server, including callers with a staff role. Only centerId is accepted. Returns enabled/allowed booleans and tokenLifetimeSeconds45, without financial amounts or manual-hold details."
      parameters:
        - {"name":"centerId","in":"query","required":true,"schema":{"type":"string"}}
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
        '503': { description: Centers or private credential source unavailable. }
  /api/centers/own/access/visits:
    get:
      tags: [centers]
      operationId: listOwnCenterAccessVisits
      summary: Read own recorded admission history
      description: "Strict own scope. No member/account selectors. Response contains only own visit IDs, timestamps and nextCursor; no operator/device/account identifiers."
      parameters:
        - {"name":"centerId","in":"query","required":true,"schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer"}}
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
        '503': { description: Centers or private credential source unavailable. }
  /api/centers/access/policy:
    post:
      tags: [centers]
      operationId: configureCenterAccess
      summary: Configure explicit center access rules
      description: "Requires access.manage, active center, current policy version and idempotency key. Initial version0. enabled, requireSubscription, denyOverdue and graceDays must all be explicit. Financial denial does not create or remove manual holds. No production activation is implied."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CenterAccessPolicyCommand' }
      responses:
        '200': { description: Current scoped result as described above. }
        '400': { description: Invalid or forbidden fields/selectors. }
        '401': { description: Missing session or invalid/expired/revoked reception-device credential. }
        '403': { description: Missing current capability. }
        '404': { description: Resource or current affiliation not visible in selected center. }
