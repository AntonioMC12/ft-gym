        Default range is the current civil month in the center time zone. Explicit date range is
        inclusive and at most 366 days. Does not fabricate future receipts, issue charges or call jobs.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
