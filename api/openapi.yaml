      description: "Derives member and recipient from session, requires current eligibility and explicit enabled policy. Valid45seconds by database clock. One outstanding token per member; replacement invalidates an older capture. Six new tokens/minute/account/center. Same current request returns identical token/expiry after a lost response within this API boot, plus database-derived remainingMs. Restart/restore invalidates earlier outstanding QR captures; generate a new request. No client clock, TTL, member or account selectors. Store/display only in memory."
