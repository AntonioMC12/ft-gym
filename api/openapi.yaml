  /api/centers/billing/debts:
    get:
      tags: [centers]
      operationId: listCenterDebts
      summary: Read outstanding receipts with derived debt state and center totals
      description: >-
        Requires billing.read or configured platform. Balances use every immutable allocation/refund,
        including refunds recorded after settlement. Center-local today and stored policy version 1
        define not-due, due, grace and overdue; due date is inclusive, overdue starts after graceDays.
        Unsupported/missing policy fails closed. Never writes delinquency or disables personal accounts.
        Totals cover the full filtered set, independently of pagination. No DNI, IBAN or private notes.
        Stable due-date/id ascending cursor is bound to actor, center, filters, today and policy.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
        - { name: dueFrom, in: query, schema: { type: string, format: date }, description: Inclusive due-date filter; requires dueTo. }
        - { name: dueTo, in: query, schema: { type: string, format: date }, description: Inclusive range of at most 366 days; requires dueFrom. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Outstanding-only page and totals for the whole filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CenterDebtPage' }
        '400': { description: Invalid dates or cursor from another scope/day/policy. }
        '401': { description: No current session. }
        '403': { description: No financial read permission. }
        '404': { description: Module off or inaccessible center. }
        '409': { description: Center inactive or debt-policy-required. }
        '503': { description: Centers unavailable. }
