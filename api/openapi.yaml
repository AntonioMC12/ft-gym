      description: At most64KiB UTF-8,20routines,40exercises per routine and200total. Existing buildPlanBundle vocabulary with finite typed prescriptions, notes up to1000characters, valid progression/pyramids/rests/intensifiers and catalogue IDs. No profile fields, custom exercises or media. Unknown nested fields rejected. Exported date is ignored for authority and canonical content.
      properties:
        opengym_plan: { type: integer, enum: [1] }
        unit: { type: string, enum: [kg, lb] }
        name: { type: string, maxLength: 120 }
        exported: { type: string }
        routines: { type: array, minItems: 1, maxItems: 20, items: { type: object } }
        week: { type: object, description: Weekdays0through6 mapped to unique source routine IDs; legacy scalar ID accepted. }
        customEx: { type: array, maxItems: 0, items: { type: object } }
    CenterTrainingWithdraw:
      type: object
      additionalProperties: false
      required: [centerId, id, version, requestId]
      properties:
