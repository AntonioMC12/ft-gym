      tags: [centers]
      operationId: getCenterNotificationStatus
      summary: Read notification policy and aggregate delivery outcomes
      description: Selected-center billing.read or explicit platform identity. No recipient emails, tokens or message bodies. Transport off by default. Test-capture requires isolated test SQL; optional Cloudflare REST requires production SQL and a server profile bound to the selected center. No credentials in this response.
      parameters:
        - { name: centerId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Policy or null, delivery state counts and transport mode. }
        '401': { description: No current session. }
        '403': { description: Insufficient capability. }
        '404': { description: No accessible center or module off. }
        '503': { description: Centers unavailable. }
  /api/platform/centers/notifications/policy:
    post:
      tags: [centers]
      operationId: configureCenterNotificationPolicy
      summary: Save an explicit center notice policy with optimistic version and idempotency
      description: Platform allowlist only. Does not configure credentials, change a contracted price or suspend training. Requires configured transport and matching SQL environment to enable. No external email provider is active by default. Due reminders group by member/deadline; debt notices group by member/repeat window. Contract changes pin the configured advance notice floor. An ambiguous provider outcome requires reconciliation and is never blindly retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [centerId, enabled, receipts, dueLeadDays, debtRepeatDays, priceNoticeDays, version, requestId]
              properties:
                centerId: { type: string }
                enabled: { type: boolean }
                receipts: { type: boolean }
                dueLeadDays: { type: integer, minimum: 0, maximum: 30 }
                debtRepeatDays: { type: integer, minimum: 1, maximum: 90 }
                priceNoticeDays: { type: integer, minimum: 1, maximum: 90 }
                version: { type: integer, minimum: 0 }
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Saved versioned policy. }
        '400': { description: Explicit valid policy required. }
        '401': { description: No current session. }
        '403': { description: Explicit platform identity required. }
        '404': { description: Center not found or module off. }
        '409': { description: Version conflict or inactive center. }
        '503': { description: Centers unavailable. }
  /api/platform/centers/notifications/retry:
    post:
      tags: [centers]
      operationId: retryBlockedCenterNotifications
      summary: Requeue at most25 blocked notices after their cause is corrected
