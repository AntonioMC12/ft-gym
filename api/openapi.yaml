      summary: Validate and consume a QR as an online reception device
      description: "Requires BOTH a current manager/platform session with access.verify AND X-Center-Device-Key for this center/device. Ordinary CSRF remains in force; no new exemption. Rejects an outstanding QR from an earlier API boot even when a restored SQL copy still contains it. Rechecks current center, policy, local opening hours, membership, current account link, contract, overdue policy and manual hold. Atomically appends visit, consumes QR and records scan.120scans/minute/device. Returns admitted/replayed/visitId and, only on first admission, operational member name/number. No financial data, hold reason or raw token is returned. A repeated successful request returns admitted false and replayed true; never a second admission or door-open command."
      parameters:
        - {"name":"X-Center-Device-Key","in":"header","required":true,"schema":{"type":"string","pattern":"^gdev1_[A-Za-z0-9_-]{43}$"}}
