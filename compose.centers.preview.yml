# Local fictional preview; use together with compose.centers.test.yml.
# Reuses that dedicated PostgreSQL volume; never loads .env or real application data.
services:
  centers-preview-api:
    image: ft-gym-centers-preview-api:local
    container_name: ft-gym-centers-preview
    # Current scope is cash recorded manually. Keep the optional Stripe carrier
    # in the image for future work, but do not load it in the ordinary preview.
    command: [node, test/centers-integration/preview.mjs]
    build:
      context: ./api
      target: centers-preview
      args:
        VCS_REF: ${CENTERS_PREVIEW_REVISION:-unknown}
      labels:
        com.ftgym.branch: ${CENTERS_PREVIEW_BRANCH:-unknown}
    environment:
      CENTERS_TEST_DATABASE_URL: postgresql://centers_app:fictional-runtime-test-only@centers-test-db/ft_gym_centers_test
      CENTERS_TEST_MIGRATION_DATABASE_URL: postgresql://centers_migrator:fictional-migrator-test-only@centers-test-db/ft_gym_centers_test
      CENTERS_STRIPE_TEST_FIXTURE: /tmp/gym-centers-stripe-fixture-preview
      CENTERS_PREVIEW_ORIGIN: ${CENTERS_PREVIEW_ORIGIN:-http://localhost:5178}
      CENTERS_PREVIEW_DATA_DIR: /tmp/ft-gym-centers-preview-data
      CENTERS_JOBS_ENABLED: '0'
      CENTERS_PREVIEW_MAINTENANCE_ENABLED: ${CENTERS_PREVIEW_MAINTENANCE_ENABLED:-0}
    volumes:
      - ../informes/centers-stripe-preview:/tmp/gym-centers-stripe-fixture-preview
      - ../informes/centers-preview-data:/tmp/ft-gym-centers-preview-data
    depends_on:
      centers-test-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [test-internal]
    restart: "no"
  centers-preview-web:
    image: ft-gym-centers-preview-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VCS_REF: ${CENTERS_PREVIEW_REVISION:-unknown}
        APP_BUILD: centers-${CENTERS_PREVIEW_REVISION:-local}
      labels:
        com.ftgym.branch: ${CENTERS_PREVIEW_BRANCH:-unknown}
    ports:
      - '127.0.0.1:5178:80'
    environment:
      BACKEND: centers-preview-api
      PORT: '3000'
      NGINX_PORT: '80'
      RESOLVER: 127.0.0.11
    depends_on:
      centers-preview-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1/api/health']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [test-internal, preview-web]
    restart: "no"
  centers-preview-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [share]
    command: [tunnel, --no-autoupdate, --url, 'http://centers-preview-web:80']
    depends_on:
      centers-preview-web:
        condition: service_healthy
    networks: [preview-web]
    restart: "no"
networks:
  preview-web: {}
