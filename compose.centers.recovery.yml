# Disposable C24 rehearsal. Never points at application data; no published ports/volumes.
name: ft-gym-centers-recovery
x-recovery-db: &recovery-db
  image: postgres:18.6-alpine3.24
  environment: &recovery-env
    POSTGRES_USER: centers_bootstrap
    POSTGRES_PASSWORD: fictional-recovery-bootstrap
    CENTERS_APP_PASSWORD: fictional-recovery-runtime
    CENTERS_MIGRATOR_PASSWORD: fictional-recovery-migrator
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
  tmpfs: [/var/lib/postgresql]
  volumes:
    - ./api/centers/docker/10-centers-roles.sh:/docker-entrypoint-initdb.d/10-centers-roles.sh:ro
    - ./api/test/centers-integration/recovery-marker.sql:/docker-entrypoint-initdb.d/20-recovery-marker.sql:ro
  networks: [recovery-internal]
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U centers_bootstrap -d "$${POSTGRES_DB}"']
    interval: 2s
    timeout: 3s
    retries: 20
services:
  recovery-source-db:
    <<: *recovery-db
    environment:
      <<: *recovery-env
      POSTGRES_DB: ft_gym_centers_test_recovery_source
  recovery-target-db:
    <<: *recovery-db
    environment:
      <<: *recovery-env
      POSTGRES_DB: ft_gym_centers_test_recovery_target
  recovery-worker:
    build:
      context: ./api
      dockerfile: test/centers-integration/Dockerfile.recovery
    image: ft-gym-centers-recovery-api:local
    command: [node, --test, test/centers-integration/recovery.drill.mjs]
    volumes:
      - ./api/test/centers-integration:/app/test/centers-integration:ro
    networks: [recovery-internal]
    depends_on:
      recovery-source-db: {condition: service_healthy}
      recovery-target-db: {condition: service_healthy}
    environment:
      CENTERS_RECOVERY_DRILL: fictional-disposable-only
      CENTERS_TEST_DATABASE_URL: postgresql://centers_app:fictional-recovery-runtime@recovery-source-db/ft_gym_centers_test_recovery_source
      CENTERS_TEST_MIGRATION_DATABASE_URL: postgresql://centers_migrator:fictional-recovery-migrator@recovery-source-db/ft_gym_centers_test_recovery_source
      CENTERS_RECOVERY_TARGET_DATABASE_URL: postgresql://centers_app:fictional-recovery-runtime@recovery-target-db/ft_gym_centers_test_recovery_target
      CENTERS_RECOVERY_TARGET_MIGRATION_URL: postgresql://centers_migrator:fictional-recovery-migrator@recovery-target-db/ft_gym_centers_test_recovery_target
      CENTERS_RECOVERY_BACKUP_PASSWORD: fictional-recovery-bootstrap
    restart: 'no'
networks:
  recovery-internal: {internal: true}
