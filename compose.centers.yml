# Add to docker-compose.yml explicitly. The original two-service deployment stays unchanged.
services:
  api:
    image: ft-gym-centers-api:local
    environment:
      CENTERS_ENABLED: "1"
      CENTERS_DATABASE_HOST: centers-db
      CENTERS_DATABASE_NAME: ${CENTERS_DB_NAME:-ft_gym_centers}
      CENTERS_DATABASE_USER: centers_app
      CENTERS_DATABASE_PASSWORD: ${CENTERS_APP_PASSWORD:?Set a separate CENTERS_APP_PASSWORD}
    networks:
      - default
      - centers-internal
    # No SQL depends_on here: training must boot even while PostgreSQL is unavailable.

  web:
    image: ft-gym-centers-web:local

  centers-db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: centers_bootstrap
      POSTGRES_DB: ${CENTERS_DB_NAME:-ft_gym_centers}
      POSTGRES_PASSWORD: ${CENTERS_BOOTSTRAP_PASSWORD:?Set CENTERS_BOOTSTRAP_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CENTERS_APP_PASSWORD: ${CENTERS_APP_PASSWORD:?Set CENTERS_APP_PASSWORD}
      CENTERS_MIGRATOR_PASSWORD: ${CENTERS_MIGRATOR_PASSWORD:?Set a separate CENTERS_MIGRATOR_PASSWORD}
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker beneath this mount.
      - centers-db-data:/var/lib/postgresql
      - ./api/centers/docker/10-centers-roles.sh:/docker-entrypoint-initdb.d/10-centers-roles.sh:ro
    networks:
      - centers-internal
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    # No published PostgreSQL port, including on localhost.

  centers-migrate:
    image: ft-gym-centers-api:local
    build:
      context: ./api
      target: ${API_TARGET:-default}
    profiles: [centers-tools]
    command: [node, centers/migrate.js]
    environment:
      CENTERS_DATABASE_HOST: centers-db
      CENTERS_DATABASE_NAME: ${CENTERS_DB_NAME:-ft_gym_centers}
      CENTERS_DATABASE_USER: centers_migrator
      CENTERS_DATABASE_PASSWORD: ${CENTERS_MIGRATOR_PASSWORD:?Set CENTERS_MIGRATOR_PASSWORD}
      CENTERS_ENVIRONMENT: ${CENTERS_ENVIRONMENT:-development}
    depends_on:
      centers-db:
        condition: service_healthy
    networks:
      - centers-internal
    restart: "no"

volumes:
  centers-db-data:

networks:
  centers-internal:
    internal: true
