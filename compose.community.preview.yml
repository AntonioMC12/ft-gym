# Local fictional preview; use together with compose.centers.test.yml.
# Uses only synthetic CI PostgreSQL and separate fictional account files. No external tunnel.
services:
  community-preview-api:
    image: ft-gym-community-preview-api:local
    container_name: ft-gym-community-preview
    command: [node, test/centers-integration/preview.mjs]
    build:
      context: ./api
      target: centers-preview
      args:
        VCS_REF: ${CENTERS_PREVIEW_REVISION:-unknown}
      labels:
        com.ftgym.branch: ${CENTERS_PREVIEW_BRANCH:-unknown}
    environment:
      CENTERS_TEST_DATABASE_URL: postgresql://centers_app:fictional-runtime-test-only@centers-ci-db/ft_gym_ci_centers_test
      CENTERS_TEST_MIGRATION_DATABASE_URL: postgresql://centers_migrator:fictional-migrator-test-only@centers-ci-db/ft_gym_ci_centers_test
      CENTERS_PREVIEW_ORIGIN: http://localhost:5179
      CENTERS_PREVIEW_DATA_DIR: /tmp/ft-gym-centers-preview-data
      CENTERS_JOBS_ENABLED: '0'
      CENTERS_PREVIEW_MAINTENANCE_ENABLED: '0'
    volumes:
      - ../informes/community-preview-data:/tmp/ft-gym-centers-preview-data
    depends_on:
      centers-ci-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [test-internal]
    restart: "no"
  community-preview-web:
    image: ft-gym-community-preview-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VCS_REF: ${CENTERS_PREVIEW_REVISION:-unknown}
        APP_BUILD: centers-${CENTERS_PREVIEW_REVISION:-local}
      labels:
        com.ftgym.branch: ${CENTERS_PREVIEW_BRANCH:-unknown}
    ports:
      - '127.0.0.1:5179:80'
    environment:
      BACKEND: community-preview-api
      PORT: '3000'
      NGINX_PORT: '80'
      RESOLVER: 127.0.0.11
    depends_on:
      community-preview-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1/api/health']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [test-internal, preview-web]
    restart: "no"
networks:
  preview-web: {}
