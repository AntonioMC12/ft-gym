name: ft-gym-demo

services:
  api:
    image: ft-gym-demo-api:local
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${FT_DEMO_RP_ID:-localhost}
      ORIGIN: ${FT_DEMO_ORIGIN:-http://localhost:8088}
      RP_NAME: Fernando Tienda Training
      FIRST_USER_ADMIN: "1"
      PASSWORD_LOGIN: "1"
      INVITE_ONLY: ${FT_DEMO_INVITE_ONLY:-0}
      ALLOW_GUEST: "1"
      COACH_DISABLED: "1"
      TRUST_PROXY: "1"
      DEFAULT_LANG: es
      MEDIA_QUOTA_MB: "50"
    volumes:
      - demo-data:/data
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  web:
    image: ft-gym-demo-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FT_DEMO_PORT:-8088}:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      MEDIA_UPLOAD_MAX: 48m

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [share]
    command: [tunnel, --no-autoupdate, --url, "http://web:80"]
    depends_on: [web]
    restart: "no"

volumes:
  demo-data:
