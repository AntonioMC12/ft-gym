<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fernando Tienda Training · Demo</title>
  <link rel="icon" href="icon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0e12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
    main{max-width:480px;text-align:center}img{width:84px;height:84px;border-radius:20px}h1{font-size:30px;line-height:1.2;letter-spacing:-.028em;margin:24px 0 12px}p{color:#a9adb8;line-height:1.6}a{display:inline-block;background:#30d158;color:#000;padding:14px 28px;border-radius:12px;font-weight:600;text-decoration:none;margin:16px 0}a:focus-visible{outline:3px solid #fff;outline-offset:4px}small{display:block;color:#818895;line-height:1.5}a[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="Fernando Tienda Training">
    <h1>Fernando Tienda Training</h1>
    <p>Tus entrenamientos, tu progreso y tu plan personal.</p>
    <a id="enter" hidden>Entrar en la demo</a>
    <p id="status" role="status">Preparando acceso a la demo…</p>
    <small>Versión de prueba. Utiliza datos ficticios.<br>La demo está disponible mientras el equipo que la aloja permanezca conectado.</small>
  </main>
  <script>
    fetch('config.json', {cache:'no-store'}).then(r => {if (!r.ok) throw new Error(); return r.json()}).then(config => {
      const url = new URL(config.demoUrl);
      if (url.protocol !== 'https:' || url.username || url.password) throw new Error();
      const link = document.getElementById('enter');
      link.href = url.href; link.hidden = false;
      document.getElementById('status').textContent = 'Abre la demo para probar la aplicación.';
    }).catch(() => {document.getElementById('status').textContent = 'La demo todavía no tiene una dirección configurada.'});
  </script>
</body>
</html>
